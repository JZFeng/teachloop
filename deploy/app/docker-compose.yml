# TeachLoop 单机部署（ai-ubuntu 等内网 Ubuntu）
#
# 由 scripts/deploy-ai-ubuntu.sh 自动拷贝到目标机并执行；不建议手工改这里，
# 改完要重新跑一次部署脚本才能生效。
#
# 端口：WEB_PORT（默认 80）指向 nginx；app 的 8010 只绑 127.0.0.1（本机健康检查用）。
name: teachloop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-teachloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要 POSTGRES_PASSWORD}
      POSTGRES_DB: teachloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teachloop} -d teachloop"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped

  app:
    image: ${TEACHLOOP_IMAGE:?需要 TEACHLOOP_IMAGE}
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/teachloop
      DB_USER: ${DB_USER:-teachloop}
      DB_PASSWORD: ${DB_PASSWORD:?需要 DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8010"
      RUN_TTS_SIDECAR: "true"
      # 内网 HTTP 部署需要关掉 Secure Cookie（prod 默认 true，只认 HTTPS）。
      # 走 HTTPS（--https）时脚本会删掉这一行。
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - uploads:/app/uploads
      - applogs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8010/healthz?deep=1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 4g
    restart: unless-stopped

  worker:
    image: ${TEACHLOOP_IMAGE:?需要 TEACHLOOP_IMAGE}
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/teachloop
      DB_USER: ${DB_USER:-teachloop}
      DB_PASSWORD: ${DB_PASSWORD:?需要 DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: worker
      TEACHLOOP_SEED_ENABLED: "false"
      RUN_TTS_SIDECAR: "false"
    volumes:
      - uploads:/app/uploads
      - applogs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    # 镜像自带的 HEALTHCHECK 打的是 /healthz（Web 端口）；worker 没有 Web，必须关掉，
    # 否则状态永远停在 health: starting。
    healthcheck:
      disable: true
    mem_limit: 2g
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

  # Cloudflare 隧道（可选）：docker compose --profile tunnel up -d
  # 默认 quick tunnel：随机 https://xxx.trycloudflare.com，重启后地址会变。
  # 买了域名之后改成 `tunnel run <隧道名>` 并配 DNS，地址就固定了。
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:80
    profiles: ["tunnel"]
    depends_on:
      web:
        condition: service_started
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  applogs:
