# teachloop.org 前端静态站点 + 后端 API 反代
# 链路：Cloudflare Tunnel -> nginx(本文件) -> app:8010（docker 网络内）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 课件/音频上传，与后端 multipart 上限对齐
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://app:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # AI 判分/生成是流式返回，关掉缓冲才不会一句话一句话地卡
        proxy_buffering off;
    }

    # 健康检查走应用；不加这条会被 SPA 回退成 index.html（200 但没有意义）
    location = /healthz {
        proxy_pass http://app:8010;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://app:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/setup、/vocab/review 等前端路由都要回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
