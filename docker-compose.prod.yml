# T161：app + worker + postgres；无 Redis。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-teachloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: teachloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teachloop} -d teachloop"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 2026-10-27：机器重启后 db 不会自启，app 连不上库 → 整站 502（当天连发两次）。
    restart: unless-stopped

  app:
    build: .
    image: teachloop:latest
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/teachloop
      DB_USER: ${DB_USER:-teachloop}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 前置链路：Cloudflare Tunnel -> nginx -> app；不设这个，登录重定向会拼成 http://
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PORT: 8010
      RUN_TTS_SIDECAR: "true"
    ports:
      - "127.0.0.1:8011:8010"
    volumes:
      - uploads:/app/uploads
      - applogs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/healthz?deep=1 >/dev/null && curl -fsS http://127.0.0.1:5002/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    image: teachloop:latest
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/teachloop
      DB_USER: ${DB_USER:-teachloop}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: worker
      TEACHLOOP_SEED_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
      - applogs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8010:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  applogs:
