<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词原型 · TeachLoop</title>
<style>
  /* ---------- 令牌：与 web/src/styles/tokens.css 同一份值 ---------- */
  :root {
    color-scheme: light;
    --bg:#f6f8fc; --panel:#fff; --panel-2:#eff4fb;
    --line:#dce4f2; --line-2:#ebf0f8; --line-strong:#7c8ba3;
    --text:#0e2340; --muted:#41536e; --muted-2:#55677f;
    --accent:#1a63e0; --accent-2:#1450bc; --accent-weak:#e8effd; --accent-text:#1a63e0; --on-accent:#fff;
    --create:#1957e7; --create-weak:#e8effd;
    --assess:#0e7066; --assess-weak:#dbf4ee;
    --insights:#3f51b5; --insights-weak:#eaecfb;
    --space-home:#0e3676; --space-home-weak:#e7edf7; --space-classes:#5b3ac4; --space-classes-weak:#eae0fd;
    --green:#17703f; --green-weak:#e6f5ec; --amber:#8a5a00; --amber-weak:#fff3d6;
    --red:#b42338; --red-weak:#fde6e8;
    --shadow:0 1px 2px rgba(14,54,118,.05),0 1px 3px rgba(14,54,118,.07);
    --shadow-lg:0 18px 44px rgba(14,54,118,.12);
    --radius:12px; --radius-sm:8px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg:#0a1120; --panel:#101a2c; --panel-2:#16223a;
    --line:#24334d; --line-2:#1b2740; --line-strong:#5e7391;
    --text:#e8eef9; --muted:#b3c0d4; --muted-2:#93a4bd;
    --accent:#2a6fd6; --accent-2:#2463c4; --accent-weak:#14233b; --accent-text:#7db1ff; --on-accent:#fff;
    --create:#6fb4ff; --create-weak:#14233b;
    --assess:#3fd6b4; --assess-weak:#0f2c28;
    --insights:#a5b4fc; --insights-weak:#1e2545;
    --space-home:#8fb4ff; --space-home-weak:#152640; --space-classes:#a78bfa; --space-classes-weak:#1e1a3a;
    --green:#6ee7a5; --green-weak:#0c2a1d; --amber:#ffc85c; --amber-weak:#2a2110;
    --red:#ff7d8a; --red-weak:#331218;
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 6px 24px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); font-size:14px; line-height:1.65;
         background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }

  .layout { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh; }

  /* ---------- 侧栏 ---------- */
  .side { background:var(--panel); border-right:1px solid var(--line); padding:16px 12px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:9px; padding:4px 8px 18px; font-size:16px; font-weight:600; }
  .brand .mark { width:26px; height:26px; border-radius:8px; background:var(--space-home); color:#fff;
                 display:grid; place-items:center; font-size:13px; font-weight:700; }
  .nav-label { font-size:12px; color:var(--muted-2); padding:10px 10px 6px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
              color:var(--muted); border:0; background:transparent; width:100%; text-align:left; margin-bottom:2px; }
  .nav-item:hover { background:var(--panel-2); }
  .nav-item.on { background:var(--accent-weak); color:var(--accent-text); font-weight:500; }
  .nav-item svg { flex:0 0 16px; opacity:.9; }
  .side-foot { position:absolute; bottom:16px; left:12px; right:12px; }
  .who { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); }
  .avatar { width:24px; height:24px; border-radius:50%; background:var(--space-classes-weak); color:var(--space-classes);
            display:grid; place-items:center; font-size:12px; font-weight:600; }

  /* ---------- 顶栏 ---------- */
  .head { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
          gap:16px; padding:10px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  .head-left { display:flex; align-items:baseline; gap:10px; }
  .head h1 { font-size:20px; margin:0; line-height:1.4; }
  .head .crumb { font-size:12px; color:var(--muted-2); }
  .head-right { display:flex; align-items:center; gap:8px; }

  /* ---------- 通用控件 ---------- */
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--text);
         padding:6px 12px; border-radius:var(--radius-sm); font-size:13px; }
  .btn:hover { border-color:var(--line-strong); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
  .btn.primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--muted); }
  .btn.ghost:hover { background:var(--panel-2); }
  .btn.sm { padding:3px 9px; font-size:12px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  .seg button { border:0; background:transparent; color:var(--muted); padding:5px 10px; font-size:12px; }
  .seg button.on { background:var(--accent-weak); color:var(--accent-text); font-weight:500; }
  .input, select.input { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-sm);
                         padding:6px 10px; font-size:13px; min-width:0; }
  .input:focus, .btn:focus-visible, .nav-item:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:1px 8px;
          border-radius:999px; background:var(--panel-2); color:var(--muted); border:1px solid var(--line-2); }
  .chip.create { background:var(--create-weak); color:var(--create); border-color:transparent; }
  .chip.assess { background:var(--assess-weak); color:var(--assess); border-color:transparent; }
  .chip.insights { background:var(--insights-weak); color:var(--insights); border-color:transparent; }
  .chip.due { background:var(--amber-weak); color:var(--amber); border-color:transparent; }
  .chip.ok { background:var(--green-weak); color:var(--green); border-color:transparent; }
  .badge-demo { font-size:12px; color:var(--muted-2); border:1px dashed var(--line-strong); border-radius:999px; padding:1px 8px; }

  /* ---------- 内容区 ---------- */
  main { padding:20px 24px 60px; max-width:1280px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad { padding:16px 18px; }
  .row { display:flex; gap:12px; align-items:center; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .muted { color:var(--muted); }
  .muted-2 { color:var(--muted-2); }
  .sm { font-size:12px; }
  .mono { font-variant-numeric:tabular-nums; }

  /* 统计 */
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .stat { padding:12px 14px; }
  .stat .k { font-size:24px; font-weight:600; line-height:1.2; }
  .stat .l { font-size:12px; color:var(--muted); }

  /* 班级生词横幅 */
  .banner { display:flex; align-items:center; gap:14px; padding:12px 16px; margin-bottom:16px;
            border:1px solid var(--line); border-left:3px solid var(--practice); border-radius:var(--radius);
            background:var(--panel); }
  .banner .ic { width:32px; height:32px; border-radius:9px; background:var(--practice-weak); color:var(--practice);
                display:grid; place-items:center; }

  /* 工具条 */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .grow { flex:1 1 200px; }

  /* 表格 */
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:500; background:var(--panel-2); }
  tbody tr:hover { background:var(--panel-2); }
  td.word { font-weight:600; font-size:15px; }
  .ph { color:var(--muted-2); font-size:12px; }

  /* 空/错/载入 状态 */
  .state { padding:48px 20px; text-align:center; }
  .state .ic { width:44px; height:44px; border-radius:12px; background:var(--panel-2); display:grid; place-items:center;
               margin:0 auto 12px; color:var(--muted); }
  .state h3 { margin:0 0 4px; font-size:16px; }
  .state p { margin:0 auto 14px; max-width:420px; color:var(--muted); font-size:13px; }
  .state.err .ic { background:var(--red-weak); color:var(--red); }
  .skeleton { height:14px; border-radius:6px; background:linear-gradient(90deg,var(--panel-2),var(--line-2),var(--panel-2));
              background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* ---------- 复习卡 ---------- */
  .review-wrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  .progress { height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden; }
  .progress > i { display:block; height:100%; background:var(--accent); }
  .flash { min-height:360px; display:grid; place-items:center; text-align:center; padding:36px 28px; cursor:pointer; }
  .flash .word { font-size:40px; font-weight:600; line-height:1.25; }
  .flash .ph { font-size:14px; margin-top:6px; }
  .flash .back { max-width:640px; text-align:left; width:100%; }
  .flash .def { font-size:20px; font-weight:600; margin-bottom:10px; }
  .flash .ex { color:var(--muted); font-size:13px; margin:4px 0; }
  .speaker { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel);
             border-radius:999px; padding:3px 10px; font-size:12px; color:var(--muted); }
  .rates { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .rate { padding:10px 8px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; align-items:center; gap:2px; }
  .rate:hover { border-color:var(--line-strong); }
  .rate .n { font-weight:600; font-size:14px; }
  .rate .d { font-size:12px; color:var(--muted-2); }
  .rate .kbd { font-size:11px; color:var(--muted-2); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .rate.again .n { color:var(--red); }
  .rate.hard .n { color:var(--amber); }
  .rate.good .n { color:var(--green); }
  .rate.easy .n { color:var(--accent-text); }
  .hint { font-size:12px; color:var(--muted-2); text-align:center; margin-top:10px; }

  /* ---------- 教师：词集 ---------- */
  .two-col { display:grid; grid-template-columns:320px minmax(0,1fr); gap:16px; align-items:start; }
  .list-item { padding:12px 14px; border-bottom:1px solid var(--line-2); cursor:pointer; }
  .list-item.on { background:var(--accent-weak); }
  .list-item:hover { background:var(--panel-2); }
  .list-item.on:hover { background:var(--accent-weak); }
  .wrow { display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line-2); }
  .wrow:last-child { border-bottom:0; }
  .handle { color:var(--muted-2); font-size:12px; width:14px; }

  /* ---------- 教师：发词 ---------- */
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field .input, .field select, .field textarea { width:100%; }
  textarea.input { resize:vertical; min-height:64px; }
  .class-pick { display:flex; flex-wrap:wrap; gap:8px; }
  .class-chip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px;
                padding:4px 11px; font-size:13px; background:var(--panel); }
  .class-chip.on { border-color:var(--accent); background:var(--accent-weak); color:var(--accent-text); }
  .preview-mini { border:1px dashed var(--line-strong); border-radius:var(--radius-sm); padding:12px 14px; }

  .toast { position:fixed; right:20px; bottom:20px; background:var(--panel); border:1px solid var(--line);
           border-left:3px solid var(--green); border-radius:var(--radius-sm); padding:10px 14px; box-shadow:var(--shadow-lg);
           font-size:13px; display:none; }
  .toast.on { display:block; }
  .foot-note { margin-top:14px; font-size:12px; color:var(--muted-2); }

  @media (max-width:1080px) {
    .layout { grid-template-columns:1fr; }
    .side { position:static; height:auto; }
    .review-wrap, .two-col, .form-grid { grid-template-columns:1fr; }
  }

  /* ---------- 第二轮：常驻工具条 / 弹窗 / 批量 / 详情 ---------- */
  .sticky-tool { position:sticky; top:57px; z-index:8; background:var(--bg); padding:10px 0; margin:-6px 0 10px; }
  .batchbar { display:flex; align-items:center; gap:10px; padding:7px 14px; margin-bottom:10px;
              background:var(--accent-weak); border:1px solid var(--line); border-radius:var(--radius-sm); }
  th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
  th.sortable:hover { color:var(--text); }
  .arrow { font-size:10px; opacity:.6; }
  .stat.clickable { cursor:pointer; border-color:var(--line); }
  .stat.clickable:hover { border-color:var(--line-strong); }
  .stat.clickable.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-weak) inset; }
  .overlay { position:fixed; inset:0; background:rgba(10,17,32,.45); display:grid; place-items:center; z-index:60; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
           width:min(600px,94vw); box-shadow:var(--shadow-lg); max-height:86vh; overflow:auto; }
  .modal .hd { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line-2); }
  .modal .bd { padding:16px 18px; display:grid; gap:14px; }
  .modal .ft { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--line-2); }
  .pop { position:absolute; right:24px; top:110px; z-index:40; width:280px; background:var(--panel);
         border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:12px 14px; }
  .pop .opt { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; }
  .pop .opt .mv { margin-left:auto; display:flex; gap:4px; }
  .detail-grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  .wf { display:flex; flex-wrap:wrap; gap:6px; }
  .wf .wfc { border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; background:var(--panel); }
  .wf .wfc b { font-weight:600; }
  .wf .wfc span { color:var(--muted-2); margin-left:4px; }
  .fav { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-sm); padding:5px 11px; font-size:13px; }
  .fav.on { border-color:var(--amber); color:var(--amber); background:var(--amber-weak); }

  .combo { position:relative; }
  .combo-list { position:absolute; z-index:30; left:0; right:0; top:38px; background:var(--panel);
                border:1px solid var(--line); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); max-height:220px; overflow:auto; }
  .combo-list button { display:block; width:100%; text-align:left; padding:7px 12px; border:0; background:transparent; font-size:13px; }
  .combo-list button:hover { background:var(--panel-2); }
  .class-panel { border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; max-height:240px; overflow:auto; }
  .cp-group + .cp-group { border-top:1px dashed var(--line-2); margin-top:10px; padding-top:10px; }

  .card-next { position:absolute; right:14px; top:50%; transform:translateY(-50%);
               display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px;
               border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:13px;
               box-shadow:var(--shadow); opacity:.55; transition:opacity .15s, background .15s; }
  .card-next:hover { opacity:1; }
  .card-next.on { opacity:1; background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
  .card-next .kbd { font-size:11px; border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.8; }
  @media (max-width:760px) { .card-next { right:50%; transform:translate(50%,0); top:auto; bottom:-18px; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><span class="mark">TL</span><span>TeachLoop</span></div>
    <div class="nav-label" id="roleLabel">学生视图</div>
    <div id="nav"></div>
    <div class="side-foot">
      <div class="who">
        <span class="avatar" id="whoAvatar">林</span>
        <div style="min-width:0">
          <div id="whoName" style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">林嘉树</div>
          <div class="sm muted-2" id="whoRole">高二(3)班 · 学生</div>
        </div>
      </div>
    </div>
  </aside>

  <div>
    <header class="head">
      <div class="head-left">
        <h1 id="title">我的词库</h1>
        <span class="crumb" id="crumb">单词 · 学生</span>
        <span class="badge-demo">示例数据</span>
      </div>
      <div class="head-right">
        <div class="seg" id="stateSeg" title="切换当前屏的数据状态">
          <button data-ds="data" class="on">有数据</button>
          <button data-ds="empty">空</button>
          <button data-ds="error">出错</button>
          <button data-ds="loading">加载</button>
        </div>
        <div class="seg" id="roleSeg" title="切换角色">
          <button data-role="student" class="on">学生</button>
          <button data-role="teacher">教师</button>
        </div>
        <button class="btn sm" id="themeBtn">暗色</button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据：全部为示例数据（页头已标注）。真实实现来自 vocab 接口。
   ============================================================ */
const SAMPLE_PASTE = `1 一行，逗号隔开
apple, brave, clever, dream, eager, fresh, giant, happy, ideal, jolly

2 一行，空格隔开
apple brave clever dream eager fresh giant happy ideal jolly

3 10行
apple
brave
clever
dream
eager
fresh
giant
happy
ideal
jolly

4 四行，3，3，3，1，逗号隔开
apple, brave, clever
dream, eager, fresh
giant, happy, ideal,
jolly`;

const WORDS = [
  { w:'abandon', ph:'/əˈbændən/', def:'v. 放弃；抛弃', src:'班级 · Unit 5', srcType:'practice',
    st:'due', due:'3 天后', ex:['He abandoned the plan without a word.','abandon oneself to despair'], an:'a-（to）+ bandon（控制）→ 交出控制权 → 放弃', note:'' },
  { w:'abolish', gen:'failed', ph:'/əˈbɒlɪʃ/', def:'v. 废除（法律、制度）', src:'班级 · Unit 5', srcType:'practice',
    st:'due', due:'今天', ex:['The law was abolished in 1998.'], an:'ab-（离开）+ olere（生长）→ 使之不再生长', note:'常接 slavery / law / tax' },
  { w:'absence', gen:'pending', ph:'/ˈæbsəns/', def:'n. 缺席；缺乏', src:'班级 · Unit 5', srcType:'practice',
    st:'new', due:'今天', ex:['Her absence went unnoticed.'], an:'ab-（离开）+ esse（存在）→ 不在场', note:'' },
  { w:'abstract', ph:'/ˈæbstrækt/', def:'adj. 抽象的 n. 摘要', src:'导入 · 高考3500', srcType:'create',
    st:'learn', due:'10 分钟后', ex:['Beauty is an abstract concept.'], an:'abs-（离开）+ tract（拉）→ 从具体中抽离', note:'反义 concrete' },
  { w:'accelerate', ph:'/əkˈseləreɪt/', def:'v. 加速', src:'导入 · 高考3500', srcType:'create',
    st:'learn', due:'5 分钟后', ex:['The car accelerated smoothly.'], an:'ac-（to）+ celer（快）', note:'' },
  { w:'accommodate', ph:'/əˈkɒmədeɪt/', def:'v. 容纳；适应', src:'自己添加', srcType:'',
    st:'review', due:'12 天后', ex:['The hall accommodates 500 people.'], an:'ac- + commod（方便）→ 提供方便', note:'两 c 两 m' },
  { w:'accompany', ph:'/əˈkʌmpəni/', def:'v. 陪伴；伴随', src:'自己添加', srcType:'',
    st:'review', due:'21 天后', ex:['She accompanied me to the station.'], an:'ac- + company（同伴）', note:'' },

function stateBlock(kind){
  if (kind==='loading') {
    return `<div class="card card-pad">
      <div class="skeleton" style="width:40%;margin-bottom:10px"></div>
      ${'<div class="skeleton" style="width:100%;margin-bottom:8px"></div>'.repeat(5)}
    </div>`;
  }
  if (kind==='empty') {
    return `<div class="card"><div class="state">
      <div class="ic">${ICONS.inbox}</div>
      <h3>词库还是空的</h3>
      <p>把下一节课的生词加进来，或者导入一份 CSV。加进来的第一个词明天就会出现在「今日复习」。</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary">${ICONS.plus} 手动加词</button>
        <button class="btn">${ICONS.upload} 批量导入</button>
      </div></div></div>`;
  }
  if (kind==='error') {
    return `<div class="card"><div class="state err">
      <div class="ic">${ICONS.alert}</div>
      <h3>没能加载词库</h3>
      <p>网络请求超时（8s）。数据没有丢，重试一次通常会好；如果一直失败，请联系老师。</p>
      <button class="btn primary">重试</button></div></div>`;
  }
  return '';
}

function currentWord(){ return WORDS[(S.free? S.freeIdx : S.idx) % WORDS.length]; }
function markKnown(word){
  if (!S.known.includes(word)) S.known.push(word);
  if (S.free) { S.freeKnown++; S.freeIdx++; }
  render();
}
function unmarkKnown(w){ S.known=S.known.filter(x=>x!==w); render(); toast('已重新加入生词本，今天可再次复习'); }
function searchGo(q){
  const key = (q||'').trim().toLowerCase();
  if (!key) { toast('输入一个单词再按 Enter'); return; }
  S.detail = key; S.newWord = null;
  S.screen = 'detail'; render();
}
function nextCard(){ if(S.free){S.freeIdx++;} else {S.idx++;} S.flipped=false; S.rated=null; render(); }
function prevCard(){ if(S.free){ if(S.freeIdx>0) S.freeIdx--; } else { if(S.idx>0) S.idx--; } S.flipped=false; S.rated=null; render(); }
function endFree(){ S.screen='summary'; render(); }
function openDetail(w){ S.detail=w; S.screen='detail'; render(); }
function nextDue(w){ const i = WORDS.indexOf(w); return i; }

function screenLibrary(){
  const BANNER = `
  <div class="banner">
    <div class="ic">${ICONS.inbox}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:500">王砚秋老师发来「Unit 5 生词」· 28 个词</div>

    </div>
    <button class="btn primary sm">查看并加入</button>
  </div>`;
  if (S.ds!=='data') return BANNER + stateBlock(S.ds);

  const known = w => S.known.includes(w) || w.st==='grad';
  let rows = WORDS.filter(w=>{
    if (S.q && !(w.w.includes(S.q.toLowerCase()) || w.def.includes(S.q))) return false;
    if (S.popFilters.src.length && !S.popFilters.src.some(k =>
          (k==='class' && w.src.startsWith('班级')) ||
          (k==='import' && w.src.startsWith('导入')) ||
          (k==='self' && w.src.startsWith('自己')))) return false;
    if (S.popFilters.deck==='wrong' && !(w.st==='learn'||w.st==='due')) return false;
    if (S.card==='due' && w.st!=='due') return false;
    if (S.card==='new' && w.st!=='new') return false;
    if (S.card==='grad' && !known(w) && w.st!=='grad') return false;
    if (S.popFilters.status!=='all' && w.st!==S.popFilters.status) return false;
    return true;
  });
  rows = rows.slice().sort((a,b)=>{
    if (S.sort==='w') return a.w.localeCompare(b.w)*S.sortDir;
    if (S.sort==='st') return a.st.localeCompare(b.st)*S.sortDir;
    return (WORDS.indexOf(a)-WORDS.indexOf(b))*S.sortDir; // next：越靠前越早复习
  });
  const allSel = rows.length>0 && rows.every(w=>S.sel.includes(w.w));
  // 「复习这些词」= 当前筛选结果里、没有被移出复习的词；不是本页显示的那几行
  const reviewable = rows.filter(w=>!known(w));
  const COL = { def:'释义', src:'来源', st:'状态', next:'下次复习' };
  const genChip = w => w.gen==='pending' ? '<span class="chip due">内容生成中</span>'
    : w.gen==='failed' ? '<span class="chip" style="background:var(--red-weak);color:var(--red);border-color:transparent">生成失败 · 重试</span>' : '';
  const stChip = w => known(w) ? '<span class="chip">已移出</span>'
    : w.st==='due' ? '<span class="chip due">今天到期</span>'
    : w.st==='new' ? '<span class="chip assess">新词</span>'
    : w.st==='learn' ? '<span class="chip">学习中</span>'
    : '<span class="chip ok">已掌握</span>';
  const arrow = k => S.sort===k ? `<span class="arrow">${S.sortDir>0?'▲':'▼'}</span>` : '';

  return BANNER + `
  <div class="stats">
    ${[
      ['1,284','总词数','',null],
      ['46','今天到期','var(--amber)','due'],
      ['12','新词（上限 20）','','new'],
      ['203','已移出','var(--green)','grad']
    ].map(([k,l,c,f])=>`<div class="card stat ${f?'clickable':''} ${S.card===f?'on':''}"
      ${f?`onclick="S.card=S.card==='${f}'?null:'${f}';render()"`:''}>
      <div class="k mono" style="${c?`color:${c}`:''}">${k}</div><div class="l">${l}${f?' · 点击过滤':''}</div></div>`).join('')}
  </div>

  <div class="toolbar sticky-tool">
    <input class="input grow" placeholder="搜索单词或释义；不在词库的词按 Enter 查看详情"
      value="${S.q}" oninput="S.q=this.value;render()"
      onkeydown="if(event.key==='Enter'){searchGo(this.value)}">
    <button class="btn" onclick="S.modal=true;render()">筛选${filterCount()?' · '+filterCount():''}</button>
    <button class="btn" onclick="S.colPop=!S.colPop;render()">列 ▾</button>
    <div style="flex:1"></div>
    <button class="btn" onclick="startFree(reviewable.length)" ${reviewable.length?'':'disabled title="当前筛选结果里没有可复习的词"'}>▶ 复习这些词（${reviewable.length}）</button>
    <button class="btn" onclick="S.addTab='file';S.screen='add';render()">${ICONS.upload} 导入</button>
    <button class="btn primary" onclick="S.addTab='paste';S.screen='add';render()">${ICONS.plus} 加词</button>
  </div>

  ${S.colPop?`<div class="pop">
    <div class="sm muted" style="margin-bottom:8px">显示列与顺序（拖动示意：上下移）</div>
    ${S.cols.map((c,i)=>`<div class="opt"><input type="checkbox" checked onchange="showToast('列配置按学生保存')">
      <span>${COL[c]}</span><span class="mv">
        <button class="btn ghost sm" onclick="moveCol(${i},-1)">↑</button>
        <button class="btn ghost sm" onclick="moveCol(${i},1)">↓</button></span></div>`).join('')}
    <div class="opt"><input type="checkbox"><span>标签</span></div>
    <div class="sm muted-2" style="margin-top:6px">默认列：单词 / 释义 / 来源 / 状态 / 下次复习 / 操作</div>
  </div>`:''}

  ${S.sel.length?`<div class="batchbar">
    <b>已选 ${S.sel.length} 个</b>
    <button class="btn sm primary" onclick="bulkKnown()">批量移出复习</button>
    <button class="btn sm" onclick="S.sel=[];render()">取消选择</button>
    <span class="sm muted">批量操作会先二次确认，提示将影响 N 个词</span>
  </div>`:''}

  <div class="card">
    <table>
      <thead><tr>
        <th style="width:38px"><input type="checkbox" ${allSel?'checked':''} onchange="toggleAll(${allSel})"></th>
        <th class="sortable" style="width:190px" onclick="setSort('w')">单词 ${arrow('w')}</th>
        ${S.cols.filter(c=>c==='def').map(()=>`<th>释义</th>`).join('')}
        ${S.cols.filter(c=>c==='src').map(()=>`<th style="width:150px">来源</th>`).join('')}
        ${S.cols.filter(c=>c==='st').map(()=>`<th class="sortable" style="width:110px" onclick="setSort('st')">状态 ${arrow('st')}</th>`).join('')}
        ${S.cols.filter(c=>c==='next').map(()=>`<th class="sortable" style="width:120px" onclick="setSort('next')">下次复习 ${arrow('next')}</th>`).join('')}
        <th style="width:104px">操作</th>
      </tr></thead>
      <tbody>
        ${rows.map(w=>`<tr>
          <td><input type="checkbox" ${S.sel.includes(w.w)?'checked':''} onchange="toggleSel('${w.w}')"></td>
          <td onclick="openDetail('${w.w}')" style="cursor:pointer">
            <div class="word">${w.w}</div><div class="ph">${w.ph}</div>
          </td>
          ${S.cols.filter(c=>c==='def').map(()=>`<td onclick="openDetail('${w.w}')" style="cursor:pointer">${w.def}${w.note?`<div class="sm muted-2">笔记：${w.note}</div>`:''}</td>`).join('')}
          ${S.cols.filter(c=>c==='src').map(()=>`<td><span class="chip ${w.srcType}">${w.src}</span></td>`).join('')}
          ${S.cols.filter(c=>c==='st').map(()=>`<td>${genChip(w)}${stChip(w)}</td>`).join('')}
          ${S.cols.filter(c=>c==='next').map(()=>`<td class="mono sm muted">${known(w)?'—':w.due}</td>`).join('')}
          <td>${known(w)?`<button class="btn sm" onclick="unmarkKnown('${w.w}')">重新加入</button>`:`<button class="btn sm" onclick="markKnown('${w.w}');toast('已移出复习；可在词库筛「已移出」找回')">移出复习</button>`}</td>
        </tr>`).join('')}
        ${rows.length===0?`<tr><td colspan="7"><div class="state" style="padding:28px"><h3>没有匹配的词</h3><p>清掉筛选或换个关键词试试。</p><button class="btn" onclick="S.card=null;S.q='';S.popFilters={src:[],deck:'all',status:'all',lang:'en'};render()">清空筛选</button></div></td></tr>`:''}
      </tbody>
    </table>
    <div class="between card-pad" style="border-top:1px solid var(--line-2)">
      <span class="sm muted">共 ${rows.length} 条（本页）· 默认按「下次复习」升序 · 点单词进详情</span>

    </div>

  ${S.modal?filterModal():''}

}

function rate(k){
  if (S.rated) return;                    // 一张卡只评一次，避免重复写日志
  S.rated = k;
  if (S.free) { if (k in S.freeRated) S.freeRated[k]++; }
  if (k === 'again') {
    // 不认识：记录为「忘记」，把答案翻出来给用户看，停在当前卡
    S.flipped = true;
    toast('已记为「不认识」· 答案已展开');
    render();
    return;
  }
  // 认识：记录后直接下一张
  toast('已记为「认识」');
  if (S.free) S.freeIdx++; else S.idx++;
  S.flipped = false; S.rated = null;
  render();
}

function setBulk(kind){
  if (kind==='delete') { SETS = SETS.filter(s=>!S.setSelRows.includes(s.id)); }
  else { SETS.forEach(s=>{ if(S.setSelRows.includes(s.id)) s.active = (kind==='active'); }); }
  toast(`已对 ${S.setSelRows.length} 个词集执行「${({active:'启用',inactive:'停用',delete:'删除'})[kind]}」`);
  S.setSelRows=[]; render();
}
function openSet(id){ S.setEdit=id; S.screen='wordsetEdit'; render(); }

function screenWordset(){
  if (S.ds!=='data') return stateBlock(S.ds);
  const q = S.setQ.trim().toLowerCase();
  const rows = SETS.filter(s=>!q || s.name.toLowerCase().includes(q));
  const allSel = rows.length>0 && rows.every(s=>S.setSelRows.includes(s.id));
  const tabs = `<div class="seg" style="margin-bottom:12px">
      <button class="${S.wordsetTab==='sets'?'on':''}" onclick="S.wordsetTab='sets';render()">词集</button>
      <button class="${S.wordsetTab==='assignments'?'on':''}" onclick="S.wordsetTab='assignments';render()">发词记录</button>
    </div>`;
  if (S.wordsetTab==='assignments') {
    const hist = [
      ['Unit 5 生词','高二(3)班','今天 09:12','3 天后截止','38/42 已领'],
      ['Unit 5 生词','高二(5)班','今天 09:12','3 天后截止','31/40 已领'],
      ['Unit 4 生词','高二(3)班','10-21 14:30','已过期','40/42 已领'],
    ];
    return tabs + `
    <div class="card">
      <table>
        <thead><tr><th>词集</th><th>班级</th><th>发送时间</th><th>截止</th><th>领取情况</th><th style="width:90px">操作</th></tr></thead>
        <tbody>${hist.map(([set,cls,when,due,claim])=>`<tr>
          <td style="font-weight:500">${set}</td><td>${cls}</td><td class="mono sm muted">${when}</td>
          <td class="sm">${due}</td><td class="sm">${claim}</td>
          <td><button class="btn sm" onclick="toast('已复制布置链接')">复制链接</button></td>
        </tr>`).join('')}</tbody>
      </table>
      <div class="card-pad sm muted" style="border-top:1px solid var(--line-2)">发出去的是快照：之后改词集不影响这些布置。</div>
    </div>`;
  }
  return tabs + `
  <div class="toolbar">
    <input class="input grow" placeholder="搜索词集" value="${S.setQ}" oninput="S.setQ=this.value;render()">
    <div style="flex:1"></div>
    <button class="btn primary" onclick="S.setEdit=null;S.screen='wordsetEdit';render()">${ICONS.plus} 新建词集</button>
  </div>
  ${S.setSelRows.length?`<div class="batchbar">
      <b>已选 ${S.setSelRows.length} 个</b>
      <button class="btn sm" onclick="setBulk('active')">启用</button>
      <button class="btn sm" onclick="setBulk('inactive')">停用</button>
      <button class="btn sm" onclick="setBulk('delete')">删除</button>
      <button class="btn sm" onclick="S.setSelRows=[];render()">取消选择</button>
    </div>`:''}
  <div class="card">
    <table>
      <thead><tr>
        <th style="width:38px"><input type="checkbox" ${allSel?'checked':''} onchange="setAll(${allSel})"></th>
        <th>名称</th><th style="width:80px">语言</th><th style="width:80px">词数</th>
        <th style="width:96px">状态</th><th style="width:120px">已发给</th><th style="width:130px">更新时间</th><th style="width:80px">操作</th>
      </tr></thead>
      <tbody>
        ${rows.map(s=>`<tr>
          <td><input type="checkbox" ${S.setSelRows.includes(s.id)?'checked':''} onchange="setSel('${s.id}')"></td>
          <td onclick="openSet('${s.id}')" style="cursor:pointer;font-weight:500">${s.name}</td>
          <td class="sm muted">${s.lang}</td>
          <td class="mono">${s.n}</td>
          <td>${s.active?'<span class="chip ok">启用</span>':'<span class="chip">已停用</span>'}</td>
          <td class="sm muted">${s.classes.length?s.classes.length+' 个班':'—'}</td>
          <td class="sm muted mono">${s.updated}</td>
          <td><button class="btn sm" onclick="openSet('${s.id}')">更新</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="card-pad sm muted" style="border-top:1px solid var(--line-2)">共 ${rows.length} 个词集 · 点名称或「更新」进入编辑</div>
  </div>
  <div class="foot-note">词集是内容资产：改词集不会影响已经发出去的布置（发送时做了快照）。停用的词集不能再发词。</div>`;
}

function screenWordsetEdit(){
  const isNew = !S.setEdit;
  const set = isNew ? { name:'', n:0, classes:[], active:true, lang:'英语', updated:'' }
                    : (SETS.find(s=>s.id===S.setEdit) || SETS[0]);
  const words = WORDS.slice(0,8);
  return `
  <div class="toolbar">
    <button class="btn" onclick="S.screen='wordset';render()">← 返回词集</button>
    <div style="flex:1"></div>
    <button class="btn" onclick="toast('打开导入：CSV / MD / TXT')">${ICONS.upload} 导入单词</button>
    <button class="btn" onclick="toast('打开粘贴加词框')">${ICONS.plus} 加词</button>
    <button class="btn primary" onclick="toast('已保存');S.screen='wordset';render()">保存</button>
  </div>
  <div class="two-col" style="grid-template-columns:minmax(0,1fr) 320px">
    <div class="card">
      <div class="card-pad" style="border-bottom:1px solid var(--line-2)">
        <div style="font-size:16px;font-weight:600">${isNew?'新建词集':'编辑：'+set.name}</div>
        <div class="sm muted">${isNew?'填名称、选语言，然后用右上角的「导入单词」或「加词」往里放词':'改名称与说明不影响已发出的布置（快照）'}</div>
      </div>
      <div class="card-pad form-grid" style="border-bottom:1px solid var(--line-2)">
        <div class="field"><label>名称</label><input class="input" value="${set.name}" placeholder="如 Unit 5 生词"></div>
        <div class="field"><label>学习语言</label><select class="input"><option>英语</option><option>中文</option><option>西班牙语</option></select></div>
        <div class="field" style="grid-column:1/-1"><label>说明（可选）</label><input class="input" placeholder="给学生的说明"></div>
      </div>
      ${set.n===0?`<div class="state" style="padding:36px 20px">
        <div class="ic">${ICONS.inbox}</div><h3>这个词集还没有词</h3>
        <p>用右上角的「导入单词」上传 CSV/MD/TXT，或「加词」把词粘贴进来。入库后内容会自动生成。</p>
      </div>`:`
      <table>
        <thead><tr><th style="width:60px">#</th><th>单词</th><th>释义</th><th style="width:90px">操作</th></tr></thead>
        <tbody>${words.map((w,i)=>`<tr>
          <td class="mono sm muted">${i+1}</td>
          <td style="font-weight:500">${w.w} <span class="ph">${w.ph}</span></td>
          <td class="sm">${w.def}</td>
          <td><button class="btn ghost sm" onclick="toast('已移出词集（不删词条）')">移除</button></td>
        </tr>`).join('')}</tbody>
      </table>
      <div class="card-pad sm muted" style="border-top:1px solid var(--line-2)">前 8 条（共 ${set.n}）· 顺序即学生首次预习顺序</div>`}
    </div>
    <aside>
      <div class="card card-pad">
        <div class="sm muted" style="margin-bottom:6px">这个词集的去向</div>
        <div class="between"><span>状态</span>
          <button class="btn sm" onclick="toast('${set.active?'已停用：不能再发词，已发出的布置不受影响':'已启用'}')">${set.active?'启用中 · 点此停用':'已停用 · 点此启用'}</button></div>
        <div class="between"><span>已发给</span><span>${set.classes.length?set.classes.length+' 个班':'还没发'}</span></div>
        <div class="between"><span>最近更新</span><span class="mono sm">${set.updated||'—'}</span></div>
        <div class="sm muted-2" style="margin-top:8px">停用后不能再发词；已发出的布置不受影响。</div>
      </div>
    </aside>
  </div>`;
}

function screenAssign(){
  if (S.ds!=='data') return stateBlock(S.ds);
  const picked = CLASSES.filter(c=>S.picked.includes(c.id));
  const taught = CLASSES.filter(c=>c.taught);
  const q = S.classQ.trim();
  const groups = ['高一','高二'];
  const chip = c => `<button class="class-chip ${S.picked.includes(c.id)?'on':''}" onclick="toggleClass('${c.id}')">
      ${S.picked.includes(c.id)?'✓ ':''}${c.name} · ${c.n} 人</button>`;
  return `
  <div class="two-col" style="grid-template-columns:minmax(0,1fr)">
    <div class="card card-pad">
      <div class="between" style="margin-bottom:10px">
        <b>发词给班级</b>
        <button class="btn ghost sm" title="说明" onclick="S.assignInfo=!S.assignInfo;render()">ⓘ 说明</button>
      </div>

      ${S.assignInfo?`<div class="card-pad" style="margin-bottom:14px;border-left:3px solid var(--accent);background:var(--panel-2);border-radius:8px">
        <div class="sm"><b>学生端会看到</b>：首页一条待办「王砚秋老师发来 Unit 5 生词 · 3 天后截止」，点进去可一键加入词库。</div>
        <div class="sm" style="margin-top:6px"><b>发送后发生什么</b>：词进学生总词库；已在库的词只追加来源、不重置进度；删除这次布置也不会删掉学生学过的词。</div>
      </div>`:''}

      <div class="form-grid">
        <div class="field" style="grid-column:1/-1"><label>选择词集（可输入搜索）</label>
          <div class="combo">
            <input class="input" placeholder="输入词集名称搜索…" value="${S.setQ}" oninput="S.setQ=this.value;S.comboOpen=true;render()" onfocus="S.comboOpen=true;render()">
            ${S.comboOpen?`<div class="combo-list">
              ${SETS.filter(s=>s.active && (!S.setQ || s.name.toLowerCase().includes(S.setQ.toLowerCase())))
                .map(s=>`<button onclick="S.setQ='${s.name}';S.comboOpen=false;render()">${s.name} <span class="sm muted">· ${s.n} 词${s.classes.length?' · 已发给 '+s.classes.length+' 个班':''}</span></button>`).join('')
                || '<div class="card-pad sm muted">没有匹配的词集</div>'}
            </div>`:''}
          </div>
        </div>

        <div class="field" style="grid-column:1/-1">
          <label>发给哪些班 <span class="muted-2">（只能选自己带的班，共 ${taught.length} 个）</span></label>
          <div class="between" style="margin-bottom:6px">
            <input class="input" style="flex:1" placeholder="搜索班级，如 高一(3)" value="${S.classQ}" oninput="S.classQ=this.value;render()">
            <button class="btn sm" onclick="pickAll()">全选</button>
            <button class="btn sm" onclick="S.picked=[];render()">清空</button>
          </div>
          <div class="class-panel">
            ${groups.map(g=>{
              const list = taught.filter(c=>c.grade===g && (!q || c.name.includes(q)));
              if (!list.length) return '';
              return `<div class="cp-group">
                <div class="between" style="margin-bottom:6px">
                  <b class="sm">${g} · ${list.length} 个班</b>
                  <button class="btn ghost sm" onclick="pickGrade('${g}')">本年级全选</button>
                </div>
                <div class="class-pick">${list.map(chip).join('')}</div>
              </div>`;
            }).join('') || '<div class="sm muted">没有匹配的班级</div>'}
          </div>
          <div class="sm muted" style="margin-top:6px">已选 <b>${picked.length}</b> 个班 · 预计 ${picked.reduce((a,c)=>a+c.n,0)} 名学生收到待办</div>
        </div>

        <div class="field"><label>预习截止（可选）</label><input class="input" type="datetime-local" value="2026-10-27T22:00"></div>
        <div class="field"><label>给学生的说明（可选）</label><input class="input" value="下节课听写 Unit 5，先过一遍"></div>
      </div>

      <div class="between" style="margin-top:16px">
        <span class="sm muted">发送时会做内容快照</span>
        <div class="row">
          <button class="btn">取消</button>
          <button class="btn primary" onclick="doAssign()">${ICONS.send} 发送给 ${picked.length} 个班</button>
        </div>
      </div>
      ${S.assigned?`<div class="card-pad" style="margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px">
        <b>已发送</b> · ${picked.map(c=>c.name).join('、')} · 共 ${picked.reduce((a,c)=>a+c.n,0)} 名学生收到待办
        <div class="sm muted" style="margin-top:2px">已对词集做快照；之后改词集不影响这次布置。</div></div>`:''}
    </div>
  </div>`;
}
function pickAll(){ S.picked = CLASSES.filter(c=>c.taught).map(c=>c.id); render(); }
function pickGrade(g){ const ids = CLASSES.filter(c=>c.taught && c.grade===g).map(c=>c.id);
  S.picked = [...new Set([...S.picked, ...ids])]; render(); }

function toggleClass(id){ S.picked = S.picked.includes(id)?S.picked.filter(x=>x!==id):[...S.picked,id]; render(); }
function doAssign(){ S.assigned=true; render(); toast('已发送给 '+S.picked.length+' 个班'); }

/* ---------------- 外壳 ---------------- */
function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = ({library:screenLibrary, review:screenReview, detail:screenDetail, summary:screenSummary, add:screenAdd,
                     wordset:screenWordset, wordsetEdit:screenWordsetEdit, assign:screenAssign})[S.screen]();
}
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 2200);
}

document.getElementById('stateSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; S.ds=b.dataset.ds; render();
});
document.getElementById('roleSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; setRole(b.dataset.role);
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  S.theme = S.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme = S.theme; render();
});
document.addEventListener('keydown', e=>{
  if (S.screen!=='review' || S.ds!=='data') return;
  if (e.code==='Space'){ e.preventDefault(); S.flipped=!S.flipped; render(); }
  if (e.key==='1'||e.key==='2') rate(e.key==='1'?'again':'good');
  if (e.key.toLowerCase()==='n' || e.key==='ArrowRight') { e.preventDefault(); nextCard(); }
  if (e.key.toLowerCase()==='s' && S.free) { markKnown(currentWord().w); toast('已移出复习'); }
});
/* 支持 #review / #wordset / #assign / #library?ds=empty 深链，方便截图与评审 */
(function initFromHash(){
  const raw = location.hash.replace('#',''); if(!raw) return;
  const [scr, qs] = raw.split('?');
  if (['library','review','detail','summary','add','wordset','wordsetEdit','assign'].includes(scr)) {
    S.screen = scr;
    S.role = ['review','library','detail','summary','add'].includes(scr) ? 'student' : 'teacher';
  if (scr==='wordsetEdit') S.setEdit = null;
  }
  if (scr==='review' && /free=1/.test(qs||'')) { S.free=true; S.freeTotal=46; S.freeIdx=12; S.freeKnown=4; }
  if (scr==='detail') S.detail = 'abandon';
  const wm = /word=([a-zA-Z'-]+)/.exec(qs||''); if (wm) S.detail = wm[1];
  if (/modal=1/.test(qs||'')) S.modal = true;
  if (/preview=1/.test(qs||'')) S.parseDone = true;
  if (/rated=again/.test(qs||'')) { S.rated='again'; S.flipped=true; }
  if (/tab=assignments/.test(qs||'')) S.wordsetTab = 'assignments';
  const m = /ds=(\w+)/.exec(qs||''); if (m) S.ds = m[1];
  if (/flip=1/.test(qs||'')) S.flipped = true;
  const t = /theme=(\w+)/.exec(qs||''); if (t) { S.theme = t[1]; document.documentElement.dataset.theme = t[1]; }
})();
render();
</script>
</body>
