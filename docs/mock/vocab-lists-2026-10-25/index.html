<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词单原型 · TeachLoop</title>
<style>
  /* ---------- 令牌：与 docs/mock/vocab-2026-10-23 同一份值 ---------- */
  :root {
    color-scheme: light;
    --bg:#f6f8fc; --panel:#fff; --panel-2:#eff4fb;
    --line:#dce4f2; --line-2:#ebf0f8; --line-strong:#7c8ba3;
    --text:#0e2340; --muted:#41536e; --muted-2:#55677f;
    --accent:#1a63e0; --accent-2:#1450bc; --accent-weak:#e8effd; --accent-text:#1a63e0; --on-accent:#fff;
    --create:#1957e7; --create-weak:#e8effd;
    --assess:#0e7066; --assess-weak:#dbf4ee;
    --insights:#3f51b5; --insights-weak:#eaecfb;
    --space-home:#0e3676; --space-home-weak:#e7edf7; --space-classes:#5b3ac4; --space-classes-weak:#eae0fd;
    --green:#17703f; --green-weak:#e6f5ec; --amber:#8a5a00; --amber-weak:#fff3d6;
    --red:#b42338; --red-weak:#fde6e8;
    --shadow:0 1px 2px rgba(14,54,118,.05),0 1px 3px rgba(14,54,118,.07);
    --shadow-lg:0 18px 44px rgba(14,54,118,.12);
    --radius:12px; --radius-sm:8px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg:#0a1120; --panel:#101a2c; --panel-2:#16223a;
    --line:#24334d; --line-2:#1b2740; --line-strong:#5e7391;
    --text:#e8eef9; --muted:#b3c0d4; --muted-2:#93a4bd;
    --accent:#2a6fd6; --accent-2:#2463c4; --accent-weak:#14233b; --accent-text:#7db1ff; --on-accent:#fff;
    --create:#6fb4ff; --create-weak:#14233b;
    --assess:#3fd6b4; --assess-weak:#0f2c28;
    --insights:#a5b4fc; --insights-weak:#1e2545;
    --space-home:#8fb4ff; --space-home-weak:#152640; --space-classes:#a78bfa; --space-classes-weak:#1e1a3a;
    --green:#6ee7a5; --green-weak:#0c2a1d; --amber:#ffc85c; --amber-weak:#2a2110;
    --red:#ff7d8a; --red-weak:#331218;
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 6px 24px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); font-size:14px; line-height:1.65;
         background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }

  /* ---------- 原型工具条（固定小条） ---------- */
  .proto-tool { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
                padding:5px 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; min-height:40px; }
  .proto-tool .pt-brand { font-weight:600; letter-spacing:.2px; }
  .proto-tool .pt-now { color:var(--muted); }
  .proto-tool .pt-now b { color:var(--text); }
  .pt-sep { width:1px; height:16px; background:var(--line); }
  .pt-label { color:var(--muted-2); }
  .pt-btn { border:1px solid var(--line); background:var(--panel); border-radius:999px;
            padding:2px 10px; font-size:12px; color:var(--muted); }
  .pt-btn:hover { border-color:var(--line-strong); color:var(--text); }
  .pt-btn.on { background:var(--accent-weak); border-color:transparent; color:var(--accent-text); font-weight:500; }
  .pt-demo { border:1px dashed var(--line-strong); border-radius:999px; padding:1px 8px; color:var(--muted-2); }
  .pt-spacer { flex:1 1 20px; }

  .layout { display:grid; grid-template-columns:236px minmax(0,1fr); min-height:calc(100vh - 41px); }

  /* ---------- 侧栏 ---------- */
  .side { background:var(--panel); border-right:1px solid var(--line); padding:16px 12px;
          position:sticky; top:41px; height:calc(100vh - 41px); }
  .brand { display:flex; align-items:center; gap:9px; padding:4px 8px 18px; font-size:16px; font-weight:600; }
  .brand .mark { width:26px; height:26px; border-radius:8px; background:var(--space-home); color:#fff;
                 display:grid; place-items:center; font-size:13px; font-weight:700; }
  .nav-label { font-size:12px; color:var(--muted-2); padding:10px 10px 6px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
              color:var(--muted); border:0; background:transparent; width:100%; text-align:left; margin-bottom:2px; }
  .nav-item:hover { background:var(--panel-2); }
  .nav-item.on { background:var(--accent-weak); color:var(--accent-text); font-weight:500; }
  .nav-item svg { flex:0 0 16px; opacity:.9; }
  .nav-hint { font-size:11px; color:var(--muted-2); padding:8px 10px; line-height:1.5; }
  .side-foot { position:absolute; bottom:16px; left:12px; right:12px; }
  .who { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); }
  .avatar { width:24px; height:24px; border-radius:50%; background:var(--space-classes-weak); color:var(--space-classes);
            display:grid; place-items:center; font-size:12px; font-weight:600; }

  /* ---------- 顶栏 ---------- */
  .head { position:sticky; top:41px; z-index:10; display:flex; align-items:center; justify-content:space-between;
          gap:16px; padding:10px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  .head-left { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .head h1 { font-size:20px; margin:0; line-height:1.4; }
  .head .crumb { font-size:12px; color:var(--muted-2); }
  .head-right { display:flex; align-items:center; gap:8px; }

  /* ---------- 通用控件 ---------- */
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--text);
         padding:6px 12px; border-radius:var(--radius-sm); font-size:13px; }
  .btn:hover { border-color:var(--line-strong); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
  .btn.primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--muted); }
  .btn.ghost:hover { background:var(--panel-2); }
  .btn.sm { padding:3px 9px; font-size:12px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  .seg button { border:0; background:transparent; color:var(--muted); padding:5px 10px; font-size:12px; }
  .seg button.on { background:var(--accent-weak); color:var(--accent-text); font-weight:500; }
  .input, select.input { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-sm);
                         padding:6px 10px; font-size:13px; min-width:0; }
  .input:focus, .btn:focus-visible, .nav-item:focus-visible, .pt-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:1px 8px;
          border-radius:999px; background:var(--panel-2); color:var(--muted); border:1px solid var(--line-2); }
  .chip.create { background:var(--create-weak); color:var(--create); border-color:transparent; }
  .chip.assess { background:var(--assess-weak); color:var(--assess); border-color:transparent; }
  .chip.insights { background:var(--insights-weak); color:var(--insights); border-color:transparent; }
  .chip.due { background:var(--amber-weak); color:var(--amber); border-color:transparent; }
  .chip.ok { background:var(--green-weak); color:var(--green); border-color:transparent; }
  .chip.err { background:var(--red-weak); color:var(--red); border-color:transparent; }
  .badge-demo { font-size:12px; color:var(--muted-2); border:1px dashed var(--line-strong); border-radius:999px; padding:1px 8px; }

  /* ---------- 内容区 ---------- */
  main { padding:20px 24px 60px; max-width:1180px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad { padding:16px 18px; }
  .row { display:flex; gap:12px; align-items:center; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .muted { color:var(--muted); }
  .muted-2 { color:var(--muted-2); }
  .sm { font-size:12px; }
  .mono { font-variant-numeric:tabular-nums; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .grow { flex:1 1 200px; }

  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:500; background:var(--panel-2); }
  tbody tr:hover { background:var(--panel-2); }
  td.word { font-weight:600; font-size:15px; }
  .ph { color:var(--muted-2); font-size:12px; }

  /* 空 / 错 / 载入 */
  .state { padding:44px 20px; text-align:center; }
  .state .ic { width:44px; height:44px; border-radius:12px; background:var(--panel-2); display:grid; place-items:center;
               margin:0 auto 12px; color:var(--muted); }
  .state h3 { margin:0 0 4px; font-size:16px; }
  .state p { margin:0 auto 14px; max-width:440px; color:var(--muted); font-size:13px; }
  .state.err .ic { background:var(--red-weak); color:var(--red); }
  .skeleton { height:14px; border-radius:6px; background:linear-gradient(90deg,var(--panel-2),var(--line-2),var(--panel-2));
              background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* 页内说明条 / 入口示意 */
  .entry-demo { border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--panel-2);
                padding:12px 14px; margin-bottom:14px; }
  .ed-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 6px; }
  .ed-fake { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-sm);
             padding:4px 10px; font-size:12px; color:var(--muted-2); }
  .ed-arrow { color:var(--muted-2); font-size:12px; }
  .ed-btn { border:1px solid var(--accent); background:var(--accent-weak); color:var(--accent-text);
            border-radius:var(--radius-sm); padding:4px 12px; font-size:12px; font-weight:500; }
  .page-lead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .page-lead .lead { font-size:13px; color:var(--muted); max-width:640px; }

  /* 词单详情头 */
  .list-head .lh-title { font-size:24px; font-weight:600; line-height:1.3; }
  .list-head .lh-desc { color:var(--muted); font-size:13px; margin-top:2px; }

  /* 页内确认条 */
  .confirm-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:12px;
                 background:var(--red-weak); border:1px solid var(--line); border-left:3px solid var(--red);
                 border-radius:var(--radius-sm); }
  .confirm-bar .cb-text { flex:1 1 320px; min-width:0; }
  .confirm-bar b { color:var(--text); }

  /* 弹层 */
  .overlay { position:fixed; inset:0; background:rgba(10,17,32,.45); display:grid; place-items:center; z-index:60; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
           width:min(520px,94vw); box-shadow:var(--shadow-lg); max-height:86vh; overflow:auto; }
  .modal .hd { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line-2); }
  .modal .bd { padding:16px 18px; display:grid; gap:12px; }
  .modal .ft { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--line-2); }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field .input { width:100%; }
  .field-err { color:var(--red); font-size:12px; margin-top:4px; }

  /* 加入词单：页内弹层（贴近 ＋ 图标） */
  .wd-head-wrap { position:relative; }
  .addpop { position:absolute; right:0; top:46px; z-index:40; width:320px; background:var(--panel);
            border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:12px 14px; text-align:left; }
  .addpop .ap-list { max-height:200px; overflow:auto; margin:8px 0; border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2); padding:6px 0; }
  .addpop .ap-opt { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; }
  .addpop .ap-opt .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addpop .ap-new { display:flex; gap:6px; margin-top:2px; }
  .addpop .ap-new .input { flex:1; }

  /* 查词页 */
  .wd-card { padding:18px 20px; }
  .wd-head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .wd-left { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; min-width:0; }
  .wd-word { font-size:34px; font-weight:600; line-height:1.2; }
  .wd-ph { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .wd-ic { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .icon-btn { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line);
              background:var(--panel); border-radius:var(--radius-sm); color:var(--muted); }
  .icon-btn:hover { border-color:var(--line-strong); color:var(--text); }
  .icon-btn.on { border-color:var(--amber); background:var(--amber-weak); color:var(--amber); }
  .icon-btn.add { border-color:var(--accent); color:var(--accent-text); background:var(--accent-weak); }
  .wd-flip { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; cursor:pointer; min-height:150px; }
  .wd-flip .hintline { font-size:12px; color:var(--muted-2); }
  .wd-def { font-size:18px; font-weight:600; }
  .wd-def-en { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .ex { color:var(--muted); font-size:13px; margin:4px 0; }

  /* 复习 */
  .rv-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
               padding:7px 14px; margin-bottom:12px; background:var(--panel); border:1px solid var(--line);
               border-left:3px solid var(--accent); border-radius:var(--radius-sm); font-size:13px; }
  .progress { height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden; }
  .progress > i { display:block; height:100%; background:var(--accent); }
  .flash { position:relative; min-height:340px; display:grid; place-items:center; text-align:center; padding:40px 28px; cursor:pointer; }
  .flash .rv-word { font-size:40px; font-weight:600; line-height:1.25; }
  .flash .rv-ph { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:14px; color:var(--muted); }
  .flash .back { max-width:620px; text-align:left; width:100%; }
  .flash .def { font-size:20px; font-weight:600; margin-bottom:8px; }
  .corner { position:absolute; right:14px; top:12px; display:flex; gap:6px; }
  .rates { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
  .rate { padding:10px 8px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; align-items:center; gap:2px; }
  .rate.lg { flex-direction:row; justify-content:center; gap:8px; padding:16px 12px; }
  .rate:hover { border-color:var(--line-strong); }
  .rate .n { font-weight:600; font-size:16px; }
  .rate .kbd { font-size:11px; color:var(--muted-2); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .rate.again .n { color:var(--red); }
  .rate.good .n { color:var(--green); }
  .rate.again.lg svg { color:var(--red); }
  .rate.good.lg svg { color:var(--green); }
  .hint { font-size:12px; color:var(--muted-2); text-align:center; margin-top:10px; }
  .speaker { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel);
             border-radius:999px; padding:2px 9px; font-size:12px; color:var(--muted); }

  /* 小结 */
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .stat { padding:12px 14px; }
  .stat .k { font-size:24px; font-weight:600; line-height:1.2; }
  .stat .l { font-size:12px; color:var(--muted); }

  .toast { position:fixed; right:20px; bottom:20px; background:var(--panel); border:1px solid var(--line);
           border-left:3px solid var(--green); border-radius:var(--radius-sm); padding:10px 14px; box-shadow:var(--shadow-lg);
           font-size:13px; display:none; max-width:420px; z-index:120; }
  .toast.on { display:block; }
  .foot-note { margin-top:14px; font-size:12px; color:var(--muted-2); }

  @media (max-width:1080px) {
    .layout { grid-template-columns:1fr; }
    .side { position:static; height:auto; }
    .side-foot { position:static; margin-top:12px; }
    .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .head, .side { top:0; }
  }
  @media (max-width:640px) {
    .wd-head { flex-direction:column; align-items:flex-start; }
    .addpop { width:min(320px,86vw); }
  }
</style>
</head>
<body>

<!-- ============ 原型工具条：当前屏名 / 跳屏 / 状态切换 / 示例数据 ============ -->
<div class="proto-tool">
  <span class="pt-brand">词单原型 · US-69</span>
  <span class="pt-now">当前屏：<b id="protoScreen">我的词单</b></span>
  <span class="pt-sep"></span>
  <span class="pt-label">跳到</span>
  <button class="pt-btn" data-screen="lists">我的词单</button>
  <button class="pt-btn" data-screen="listDetail">词单详情</button>
  <button class="pt-btn" data-screen="wordDetail">查词页</button>
  <button class="pt-btn" data-screen="review">复习</button>
  <button class="pt-btn" data-screen="summary">小结</button>
  <span class="pt-sep"></span>
  <span class="pt-label">状态</span>
  <button class="pt-btn" data-ds="data">有数据</button>
  <button class="pt-btn" data-ds="empty">空</button>
  <button class="pt-btn" data-ds="error">出错</button>
  <span class="pt-demo">示例数据 · 可点击</span>
  <span class="pt-spacer"></span>
  <button class="pt-btn" id="themeBtn">暗色</button>
</div>

<div class="layout">
  <aside class="side">
    <div class="brand"><span class="mark">TL</span><span>TeachLoop</span></div>
    <div class="nav-label">学生视图</div>
    <div id="nav"></div>
    <div class="nav-hint">只有两项一级导航（AC-69.11）。词单是「我的词库」页工具条里的入口，不占导航。</div>
    <div class="side-foot">
      <div class="who">
        <span class="avatar">林</span>
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">林嘉树</div>
          <div class="sm muted-2">高二(3)班 · 学生</div>
        </div>
      </div>
    </div>
  </aside>

  <div>
    <header class="head">
      <div class="head-left">
        <h1 id="title">我的词单</h1>
        <span class="crumb" id="crumb">我的词库 · 词单</span>
      </div>
      <div class="head-right">
        <span class="badge-demo">示例数据</span>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据：全部为示例数据（页头与工具条已标注）。真实接口见
   docs/decisions/020-vocab-word-lists.md 第 6 节。
   模型：词条一份（ENTRIES）+ 进度一份（PROGRESS）；词单只存词形引用。
   ============================================================ */
const ENTRIES = {
  solitude:  { form:'solitude', uk:'/ˈsɒlɪtjuːd/', us:'/ˈsɑːlətuːd/', band:'前 4 千高频词族', pos:'n.', def:'独处；孤独', en:'the state of being alone, especially when it is peaceful',
               ex:[['She enjoyed the solitude of the early morning.','她享受清晨的独处。'],['He wrote in solitude for three years.','他在独处中写了三年。']],
               an:'sol（单独）+ -itude（名词后缀）→ 独自一人的状态', fav:false },

/* ---------------- 小工具 ---------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function entry(f){ return ENTRIES[f] || { form:f, uk:'/—/', us:'/—/', band:'—', pos:'', def:'（内容生成中）', en:'', ex:[], an:'', fav:false }; }
function isPaused(f){ return !!(PROGRESS[f] && PROGRESS[f].paused); }
function listById(id){ return LISTS.find(l=>l.id===id); }
function curList(){ return listById(S.cur) || LISTS[0]; }
function pausedOf(l){
  if (!l) return 0;
  return l.n === l.items.length ? l.items.filter(isPaused).length : (l.pausedTotal || 0);
}
function reviewableOf(l){ return Math.max(0, l.n - pausedOf(l)); }
function belongs(form){ return LISTS.filter(l=>l.items.includes(form)).map(l=>l.name); }

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 2400);
}

/* ---------------- 跳屏 ---------------- */
function go(screen){
  if (screen!==S.screen){
    S.newOpen=false; S.renId=null; S.addOpen=false; S.addOpen2=false;
    S.newErr=''; S.renErr=''; S.addErr=''; S.delId=null;
    S.flip=false; S.wdFlip=false;
  }
  S.screen=screen; render();
}
function quick(screen){
  if ((screen==='review'||screen==='summary') && !S.rv.listId) seedReview('novel');
  if (screen==='listDetail') S.cur = S.cur || 'novel';
  go(screen);
}
function openList(id){
  const l = listById(id);
  if (!l){ toast('这份词单不存在，可能已被删除'); return; }
  S.cur=id; S.addPick=[]; S.delId=null; go('listDetail');
}
function openWord(form, fromList){
  S.wd=form; S.fromList=!!fromList; S.wdFlip=false; S.addOpen=false;
  S.addSel=[]; S.addNew=''; S.addErr='';
  go('wordDetail');
}

function confirmDeleteBar(l){

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function focusEnd(id){
  const e = document.getElementById(id); if (!e) return;
  if (document.activeElement!==e){ e.focus(); const v=e.value; e.value=''; e.value=v; }
}
function openNew(){
  if (LISTS.length>=MAX_LISTS){ toast('词单已达上限 100 份，先删一份再新建'); return; }
  S.newOpen=true; S.newName=''; S.newDesc=''; S.newErr=''; S.ds='data'; render();
  const e=document.getElementById('newNameInput'); if(e) e.focus();
}
function createList(){
  const name = (S.newName||'').trim();
  if (!name){ S.newErr='名字不能为空，1–80 字'; toast('名字不能为空，词单没有创建'); render(); return; }
  if (name.length>80){ S.newErr='名字最多 80 字'; toast('名字最多 80 字，词单没有创建'); render(); return; }
  if (LISTS.some(l=>l.name.toLowerCase()===name.toLowerCase())){
    S.newErr=`已有一份叫「${name}」的词单，换个名字（重名不区分大小写）`;
    toast(`重名：已有一份叫「${name}」的词单`); render(); return;
  }
  LISTS.unshift({ id:'l'+Date.now(), name, desc:(S.newDesc||'').trim(), n:0, pausedTotal:0, updated:'刚刚', items:[], added:{} });
  S.newOpen=false; S.newName=''; S.newDesc=''; S.newErr=''; S.ds='data';
  render(); toast(`已创建词单「${name}」，词数 0，现在可以往里加词`);
}
function openRename(id){
  const l = listById(id); if (!l) return;
  S.renId=id; S.renName=l.name; S.renDesc=l.desc||''; S.renErr=''; render();
  const e=document.getElementById('renNameInput'); if(e) e.focus();
}
function doRename(){
  const l = listById(S.renId); if (!l) return;
  const name=(S.renName||'').trim();
  if (!name){ S.renErr='名字不能为空，1–80 字'; toast('名字不能为空，没有保存'); render(); return; }
  if (name.length>80){ S.renErr='名字最多 80 字'; toast('名字最多 80 字，没有保存'); render(); return; }
  if (LISTS.some(x=>x.id!==l.id && x.name.toLowerCase()===name.toLowerCase())){
    S.renErr=`已有一份叫「${name}」的词单，换个名字（重名不区分大小写）`;
    toast(`重名：已有一份叫「${name}」的词单`); render(); return;
  }
  const changed = name!==l.name;
  l.name=name; l.desc=(S.renDesc||'').trim(); l.updated='刚刚';
  S.renId=null; S.renErr=''; render();
  toast(changed?`已重命名为「${name}」`:'已保存词单信息');
}
function doDeleteList(id){
  const l = listById(id); if (!l) return;
  const n = l.n, name = l.name, wasCur = S.cur===id;
  LISTS = LISTS.filter(x=>x.id!==id);
  S.delId=null;
  if (S.rv.listId===id) S.rv={ listId:null, pool:[], total:0, cursor:0, known:0, unknown:0, skip:0 };
  if (wasCur){                       // 正在看的词单被删 → 回到「我的词单」，不留在一个不相干的详情页
    S.cur = LISTS[0] ? LISTS[0].id : null;
    S.screen = 'lists';
  }
  render();
  toast(`已删除词单「${name}」，${n} 个词仍在词库，学习进度不变`);
}

  return `<div class="addpop" onclick="event.stopPropagation()">

    <div class="ap-list">
      ${LISTS.length?LISTS.map(l=>{

          <span class="nm">${esc(l.name)}</span>
          <span class="sm muted-2">${l.n} 词</span>
          ${has?'<span class="chip ok">已在词单</span>':''}

      }).join(''):'<div class="sm muted">还没有词单。在下面输入一个名字，会同时建好并加入。</div>'}
    </div>
    <div class="field">
      <label>新建词单（可选）</label>
      <div class="ap-new">
        <input class="input" maxlength="80" placeholder="如 小说生词" value="${esc(S.addNew)}"
          oninput="S.addNew=this.value;S.addErr='';render();keepFocus('addNewInput')" id="addNewInput"
          onkeydown="if(event.key==='Enter'){doAddToList()}">
      </div>
    </div>
    ${S.addErr?`<div class="field-err">${esc(S.addErr)}</div>`:''}

      <button class="btn primary" onclick="doAddToList()">加入</button>
    </div>
  </div>`;
}
function keepFocus(id){
  const e=document.getElementById(id); if(!e) return;
  if (document.activeElement!==e){ e.focus(); const v=e.value; e.value=''; e.value=v; }
}
function toggleAddSel(id){ S.addSel = S.addSel.includes(id)?S.addSel.filter(x=>x!==id):[...S.addSel,id]; S.addErr=''; render(); }
function doAddToList(){
  const form = S.wd;
  const picked = S.addSel.slice();
  const newName = (S.addNew||'').trim();
  if (!picked.length && !newName){
    const inAll = belongs(form);
    S.addErr = inAll.length && inAll.length===LISTS.length
      ? `这个词已经在${inAll.map(n=>`「${n}」`).join('')}里，不需要重复加入`
      : '先勾选一份词单，或者输入一个新词单的名字';
    render(); return;
  }
  if (newName && newName.length>80){ S.addErr='名字最多 80 字'; render(); return; }
  if (newName){
    const dup = LISTS.find(l=>l.name.toLowerCase()===newName.toLowerCase());
    if (dup){ if (!picked.includes(dup.id)) picked.push(dup.id); }
    else {
      const nl = { id:'l'+Date.now(), name:newName, desc:'', n:0, pausedTotal:0, updated:'刚刚', items:[], added:{} };
      LISTS.unshift(nl); picked.push(nl.id);
    }
  }
  const added=[], dups=[];
  picked.forEach(id=>{
    const l = listById(id); if (!l) return;
    if (l.items.includes(form)){ dups.push(l.name); return; }
    l.items.push(form); l.n = l.n + 1; l.added[form]='刚刚'; l.updated='刚刚'; added.push(l.name);
  });
  S.addSel=[]; S.addNew=''; S.addErr='';
  if (!added.length){
    S.addErr = `这个词已在「${dups[0]}」，没有重复计入`;
    render(); toast(`已在词单「${dups[0]}」，没有重复计入`); return;
  }
  S.addOpen = false;
  render();
  const names = added.map(n=>`『${n}』`).join('');
  toast(dups.length ? `已加入${names} · ${dups.map(n=>`『${n}』`).join('')}之前已在词单` : `已加入${names}`);
}
function isFav(form){
  const e = entry(form), p = PROGRESS[form];
  return p && p.favOn!==undefined ? p.favOn : !!e.fav;
}
function toggleFav(form){
  const e = entry(form);
  if (!PROGRESS[form]) PROGRESS[form] = { paused:false, state:'新词', due:'今天' };
  const p = PROGRESS[form];
  if (p.favOn===undefined) p.favOn = !!e.fav;
  p.favOn = !p.favOn;
  render();
  toast(p.favOn ? '已收藏' : '已取消收藏');
}
function togglePause(form){
  if (!PROGRESS[form]) PROGRESS[form] = { paused:false, state:'新词', due:'今天' };
  PROGRESS[form].paused = !PROGRESS[form].paused;
  PROGRESS[form].due = PROGRESS[form].paused ? '—' : '今天';
  render();
  toast(PROGRESS[form].paused ? '已暂停复习；这个词在所有词单里都不再参与复习' : '已恢复复习，进度保留');
}

/* ---------------- 屏 4：从词单进入的复习 ---------------- */
function seedReview(listId){
  const l = listById(listId); if (!l) return;
  const pool = l.items.filter(f=>!isPaused(f));
  const total = reviewableOf(l);
  const seedSeen = listId==='novel' ? Math.min(8, Math.max(0,total-2)) : 0;
  S.rv = {
    listId, pool: pool.length?pool:['—'], total,
    cursor: seedSeen,
    known: listId==='novel'?6:0,
    unknown: listId==='novel'?2:0,
    skip:0,
  };
  if (listId!=='novel'){ S.rv.known=0; S.rv.unknown=0; }
}
function startReview(listId){
  const l = listById(listId); if (!l) return;
  S.cur = listId;
  if (reviewableOf(l)===0){
    toast('这份词单里的词都已暂停，恢复后即可开始复习');
    go('listDetail'); return;
  }
  seedReview(listId);
  S.flip=false;
  go('review');
}
function rvList(){ return listById(S.rv.listId) || curList(); }
function rvWord(){
  const pool = S.rv.pool.length?S.rv.pool:['—'];
  return entry(pool[S.rv.cursor % pool.length]);
}
function seenCount(){ return S.rv.known + S.rv.unknown + S.rv.skip; }

function screenReview(){
  const l = rvList();
  if (!l) return emptyListsBlock();
  if (S.ds==='error') return errorBlock('这一轮复习');
  if (S.ds==='empty' || S.rv.total===0 || S.rv.pool.length===0 || S.rv.pool[0]==='—'){
    return `<div class="card"><div class="state">
      <div class="ic">${ICONS.inbox}</div>
      <h3>这份词单没有可复习的词</h3>
      <p>${esc(l.name)} 里的词都已被暂停。暂停的词不在复习范围里，恢复后才会重新进来。</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" onclick="openList('${l.id}')">返回词单</button>
      </div>
    </div></div>`;
  }
  const w = rvWord();
  const seen = seenCount();
  const pct = Math.min(100, Math.round(S.rv.cursor / Math.max(1,S.rv.total) * 100));
  const fav = isFav(w.form);
  const paused = isPaused(w.form);

  const front = `
    <div class="flash" onclick="S.flip=true;render()">
      <div class="corner">
        <button class="icon-btn ${fav?'on':''}" title="收藏" onclick="event.stopPropagation();toggleFav('${w.form}')">${ICONS.star}</button>
        <button class="icon-btn" title="${paused?'恢复复习':'暂停复习'}" onclick="event.stopPropagation();togglePauseInReview('${w.form}')">
          ${paused?ICONS.play:ICONS.pause}</button>
      </div>
      <div>
        <div class="rv-word">${w.form}</div>
        <div class="rv-ph">
          <span>UK <span class="mono">${w.uk}</span></span>
          <button class="speaker" onclick="event.stopPropagation();toast('朗读 UK（缓存命中 32ms）')">${ICONS.speaker}</button>
          <span>US <span class="mono">${w.us}</span></span>
          <button class="speaker" onclick="event.stopPropagation();toast('朗读 US（缓存命中 35ms）')">${ICONS.speaker}</button>
        </div>
        <div class="hint">点卡片或按空格翻面看释义</div>
      </div>
    </div>`;
  const back = `
    <div class="flash" onclick="S.flip=false;render()">
      <div class="corner">
        <button class="icon-btn ${fav?'on':''}" title="收藏" onclick="event.stopPropagation();toggleFav('${w.form}')">${ICONS.star}</button>
        <button class="icon-btn" title="${paused?'恢复复习':'暂停复习'}" onclick="event.stopPropagation();togglePauseInReview('${w.form}')">
          ${paused?ICONS.play:ICONS.pause}</button>
      </div>
      <div class="back">
        <div class="between" style="margin-bottom:6px">
          <div><span style="font-size:24px;font-weight:600">${w.form}</span> <span class="ph">${w.uk}</span></div>
        </div>
        <div class="def">${w.pos} ${w.def}</div>
        <div class="sm muted" style="margin-bottom:8px">${w.en}</div>
        ${w.ex.map(([en,zh])=>`<div class="ex">· ${en}<div class="sm muted-2">${zh}</div></div>`).join('')}
        <div class="sm" style="margin-top:10px;color:var(--muted)">构词：${w.an}</div>
        <div class="hint">点卡片或按空格翻回正面</div>
      </div>
    </div>`;

  return `
  <div class="rv-banner">
    <span>本次范围：<b>${esc(l.name)}</b> · ${S.rv.total} 词（已排除暂停）</span>
    <span class="row" style="gap:6px">
      <button class="btn ghost sm" onclick="resetReview()">从头开始</button>
      <button class="btn sm" onclick="endReview()">结束复习</button>
    </span>
  </div>

  <div class="between" style="margin-bottom:6px">
    <span class="sm muted">已看过 <b class="mono" style="color:var(--text)">${seen} / ${S.rv.total}</b>
      ${S.rv.cursor>0?`· 从第 ${S.rv.cursor+1} 张继续（上次停留的位置）`:''}</span>
    <span class="sm muted-2">不受到期时间与每日新卡上限限制</span>
  </div>
  <div class="progress" style="margin-bottom:14px"><i style="width:${pct}%"></i></div>

  <div class="card">${S.flip?back:front}</div>

  <div class="rates">
    <button class="rate again lg" onclick="rate('again')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="n">不认识</span> <span class="kbd">1</span>
    </button>
    <button class="rate good lg" onclick="rate('good')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>
      <span class="n">认识</span> <span class="kbd">2</span>
    </button>
  </div>
  <div class="hint">空格翻面 · 1 不认识 · 2 认识 · 评分后自动推进下一张</div>
  <div class="foot-note">词单复习复用自由复习的会话：同一张卡、同一两档评分；不写入「今日复习」的完成数（AC-69.7 / AC-61.5）。示例数据。</div>`;
}
function togglePauseInReview(form){
  togglePause(form);
}
function rate(kind){
  if (S.rv.total===0) return;
  if (kind==='good') S.rv.known++; else S.rv.unknown++;
  S.rv.cursor++;
  S.flip=false;
  if (S.rv.cursor>=S.rv.total){
    render();
    toast(kind==='good'?'已记为「认识」· 这一轮看完了':'已记为「不认识」· 这一轮看完了');
    go('summary');
    return;
  }
  render();
  toast(kind==='good'?'已记为「认识」':'已记为「不认识」');
}
function resetReview(){
  S.rv.cursor=0; S.rv.known=0; S.rv.unknown=0; S.rv.skip=0; S.flip=false;
  render(); toast('已从头开始，本次计数清零');
}
function endReview(){ go('summary'); }

/* ---------------- 屏 5：结束小结 ---------------- */
function screenSummary(){
  const l = rvList();
  const known = S.rv.known, unknown = S.rv.unknown, skip = S.rv.skip;
  const seen = seenCount();
  return `
  <div class="card card-pad" style="max-width:680px;margin:24px auto">
    <div style="text-align:center">
      <div style="font-size:22px;font-weight:600">这一轮看完了</div>
      <div class="sm muted" style="margin-bottom:16px">
        ${l?`范围：${esc(l.name)} · ${S.rv.total} 词`:'范围：—'} · 未看的词保持原状态不变
      </div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="k mono">${seen}</div><div class="l">看过</div></div>
      <div class="card stat"><div class="k mono" style="color:var(--green)">${known}</div><div class="l">认识</div></div>
      <div class="card stat"><div class="k mono" style="color:var(--red)">${unknown}</div><div class="l">不认识</div></div>
      <div class="card stat"><div class="k mono">${skip}</div><div class="l">跳过</div></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" onclick="openList('${S.rv.listId||S.cur}')">返回词单</button>
      <button class="btn" onclick="replayReview()">再看一遍</button>
    </div>
    <div class="sm muted-2" style="text-align:center;margin:14px auto 0;max-width:520px">
      示例数据：这一轮从上次停留的位置（第 9 张）继续，所以默认是 看过 8 / 认识 6 / 不认识 2 / 跳过 0；继续评分后数字随实际评分增长。
    </div>
    <div class="sm muted-2" style="text-align:center;margin:6px auto 0;max-width:520px">
      词单复习不写入「今日复习」的完成数；「认识 / 不认识」按与今日复习相同的规则推进进度，一份排期、不属于任何词单。
    </div>
    <div class="sm muted-2" style="text-align:center;margin:6px auto 0;max-width:520px">
      这一轮没有「跳过」：本原型底部的两个评分按钮就是全部动作；真实页面另有「下一个（N / →）」只推进游标、不写日志（AC-61.2）。
    </div>
  </div>`;
}
function replayReview(){
  S.rv.cursor=0; S.rv.known=0; S.rv.unknown=0; S.rv.skip=0; S.flip=false;
  go('review'); toast('再看一遍：从第一个词开始');
}

/* ---------------- 外壳 ---------------- */
function renderShell(){
  const screen = S.screen;
  document.getElementById('protoScreen').textContent = SCREEN_NAMES[screen] || screen;
  document.querySelectorAll('.proto-tool [data-screen]').forEach(b=>b.classList.toggle('on', b.dataset.screen===screen));
  document.querySelectorAll('.proto-tool [data-ds]').forEach(b=>b.classList.toggle('on', b.dataset.ds===S.ds));
  document.getElementById('themeBtn').textContent = S.theme==='light'?'暗色':'亮色';

  document.getElementById('nav').innerHTML = NAV.map(i=>{
    const on = i.id==='library';   // 词单是「我的词库」下的页面，导航不变
    return `<button class="nav-item ${on?'on':''}" onclick="navClick('${i.id}')">${ICONS[i.icon]}<span>${i.label}</span></button>`;
  }).join('');

  const [t,c] = TITLES[screen];
  document.getElementById('title').textContent = t;
  let crumb = c;
  if (screen==='listDetail' && curList()) crumb = `我的词库 · 词单 / ${curList().name}`;
  if ((screen==='review'||screen==='summary') && rvList()) crumb = `我的词库 · 词单 / ${rvList().name}`;
  document.getElementById('crumb').textContent = crumb;
}
function navClick(id){
  if (id==='library'){ toast('本原型只画词单相关页面；「我的词库」见上一轮原型 vocab-2026-10-23'); }
  else { toast('本原型不含「今日复习」；词单复习不写入今日完成数'); }
}
function render(){
  renderShell();
  const map = {
    lists:screenLists, listDetail:screenListDetail, wordDetail:screenWordDetail,
    review:screenReview, summary:screenSummary,
  };
  document.getElementById('main').innerHTML = (map[S.screen]||screenLists)();
}

/* ---------------- 事件绑定 ---------------- */
document.querySelector('.proto-tool').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.screen){ quick(b.dataset.screen); return; }
  if (b.dataset.ds){ S.ds=b.dataset.ds; if(S.ds!=='data'){S.newOpen=false;S.renId=null;S.addOpen2=false;S.addOpen=false;} render(); return; }
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  S.theme = S.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme = S.theme; render();
});
document.addEventListener('keydown', e=>{
  if (e.target && /INPUT|TEXTAREA/.test(e.target.nodeName)) return;
  if (S.screen==='wordDetail'){
    if (e.code==='Space'){ e.preventDefault(); S.wdFlip=!S.wdFlip; render(); }
    return;
  }
  if (S.screen==='review' && S.ds==='data'){
    if (e.code==='Space'){ e.preventDefault(); S.flip=!S.flip; render(); }
    if (e.key==='1') rate('again');
    if (e.key==='2') rate('good');
  }
});

/* ---------------- 深链，便于截图： #listDetail?ds=empty&id=novel 等 ---------------- */
(function initFromHash(){
  const raw = location.hash.replace('#',''); if (!raw) return;
  const [scr, qs] = raw.split('?');
  if (['lists','listDetail','wordDetail','review','summary'].includes(scr)) S.screen = scr;
  const m = /ds=(\w+)/.exec(qs||''); if (m) S.ds = m[1];
  const id = /id=(\w+)/.exec(qs||''); if (id && listById(id[1])) S.cur = id[1];
  const w = /word=([a-zA-Z'-]+)/.exec(qs||''); if (w) S.wd = w[1];
  if (/flip=1/.test(qs||'')) { S.flip = true; S.wdFlip = true; }
  if (/add=1/.test(qs||'')) S.addOpen = true;
  if (/new=1/.test(qs||'')) S.newOpen = true;
  if (/del=1/.test(qs||'')) S.delId = S.cur;
  if (scr==='review' || scr==='summary') seedReview(S.cur || 'novel');
  const t = /theme=(\w+)/.exec(qs||''); if (t) { S.theme = t[1]; document.documentElement.dataset.theme = t[1]; }
})();
render();
</script>
</body>
</html>
