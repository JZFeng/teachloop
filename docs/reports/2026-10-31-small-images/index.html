<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>词卡配图 · 自适应小尺寸实测（300×249）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ffffff;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 18px 20px;
  }
  .note { font-size: 15px; line-height: 1.7; margin: 0 0 6px; font-weight: 600; }
  .note small { display: block; font-weight: 400; font-size: 13px; color: #57606a; margin-top: 4px; }
  /* 图片区：靠页面最下方 */
  .gallery {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(4, 300px);
    gap: 12px;
    align-content: end;
    justify-content: start;
  }
  .card { margin: 0; }
  .card img {
    display: block;
    width: 300px;
    height: 249px;
    border-radius: 8px;
    border: 1px solid #e6e8eb;
    background: #faf9f6;
  }
  .card figcaption {
    font-size: 13px;
    line-height: 18px;
    color: #57606a;
    margin-top: 6px;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
<div class="page">
  <p class="note">10 张 300×249 实际尺寸
    <small>Qwen-Image fp8 · 512×512 生成 → 按 300:249 居中裁切缩放 · 下方即词卡小图真实像素，未做任何放大</small>
  </p>

  <div class="gallery">
    <figure class="card"><img src="images/apple.png" width="300" height="249" alt="apple"><figcaption>apple</figcaption></figure>
    <figure class="card"><img src="images/ambiguous.png" width="300" height="249" alt="ambiguous"><figcaption>ambiguous</figcaption></figure>
    <figure class="card"><img src="images/coherent.png" width="300" height="249" alt="coherent"><figcaption>coherent</figcaption></figure>
    <figure class="card"><img src="images/consequent.png" width="300" height="249" alt="consequent"><figcaption>consequent</figcaption></figure>
    <figure class="card"><img src="images/bias.png" width="300" height="249" alt="bias"><figcaption>bias</figcaption></figure>
    <figure class="card"><img src="images/hierarchy.png" width="300" height="249" alt="hierarchy"><figcaption>hierarchy</figcaption></figure>
    <figure class="card"><img src="images/integrate.png" width="300" height="249" alt="integrate"><figcaption>integrate</figcaption></figure>
    <figure class="card"><img src="images/emerge.png" width="300" height="249" alt="emerge"><figcaption>emerge</figcaption></figure>
    <figure class="card"><img src="images/expand.png" width="300" height="249" alt="expand"><figcaption>expand</figcaption></figure>
    <figure class="card"><img src="images/erode.png" width="300" height="249" alt="erode"><figcaption>erode</figcaption></figure>
  </div>
</div>
</body>
</html>
