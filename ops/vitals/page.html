<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeachLoop · prod vitals</title>
<style>
  /* 颜色全部取自 web/src/ui/tokens.ts 的两套主题：亮色 #1A63E0 / 暗色 #2A6FD6，
     圆角 12/8/6，正文 14px；无渐变、无彩色投影。 */
  :root{
    --bg:#F6F8FC; --card:#FFFFFF; --line:#DCE4F2;
    --text:#0E2340; --muted:#41536E; --faint:#7C8BA3;
    --primary:#1A63E0; --ok:#17703F; --ok-bg:#E6F5EC;
    --warn:#8A5A00; --warn-bg:#FFF3D6; --err:#B42338; --err-bg:#FDE6E8;
    --fill:#EFF4FB;
    --shadow:0 1px 2px rgba(14,54,118,.05), 0 1px 3px rgba(14,54,118,.07);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0A1120; --card:#101A2C; --line:#24334D;
    --text:#E8EEF9; --muted:#B3C0D4; --faint:#93A4BD;
    --primary:#2A6FD6; --ok:#6EE7A5; --ok-bg:#0C2A1D;
    --warn:#FFC85C; --warn-bg:#2A2110; --err:#FF7D8A; --err-bg:#331218;
    --fill:#16223A; --shadow:0 1px 2px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  }
  header{
    position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
    padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  header h1{font-size:16px;font-weight:600;margin:0}
  header .spacer{flex:1}
  header .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600}
  .pill.ok{color:var(--ok);background:var(--ok-bg)}
  .pill.warn{color:var(--warn);background:var(--warn-bg)}
  .pill.down{color:var(--err);background:var(--err-bg)}
  .pill.idle{color:var(--muted);background:var(--fill)}
  .seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
  .seg button{
    font:inherit;font-size:13px;line-height:1.4;padding:3px 10px;border:0;border-radius:6px;cursor:pointer;
    background:transparent;color:var(--muted);
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
  /* 暗色下 --card 与 --fill 太接近，选中态另给一档更亮的底（2026-10-29 实测截图对比） */
  html[data-theme="dark"] .seg button[aria-pressed="true"]{background:#1E2E4A}
  main{max-width:1180px;margin:0 auto;padding:20px 24px 48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:.02em}
  .big{font:600 32px/1.2 var(--mono);font-variant-numeric:tabular-nums}
  .big small{font-size:14px;font-weight:500;color:var(--muted);font-family:inherit}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0}
  .row + .row{border-top:1px solid var(--fill)}
  .row .k{color:var(--muted);font-size:13px}
  .row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.down{background:var(--err)} .dot.idle{background:var(--faint)}
  .bar{height:6px;border-radius:6px;background:var(--fill);overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;border-radius:6px;background:var(--primary)}
  .bar.warn > i{background:var(--warn)} .bar.down > i{background:var(--err)}
  .containers{display:flex;flex-direction:column;gap:2px}
  .container{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
  .container + .container{border-top:1px solid var(--fill)}
  .container .name{font-family:var(--mono);font-size:13px}
  .container .st{color:var(--muted);font-size:12px;text-align:right}
  footer{margin-top:20px;color:var(--faint);font-size:12px}
  .banner{border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:600}
  .banner.down{background:var(--err-bg);color:var(--err)}
  .banner.warn{background:var(--warn-bg);color:var(--warn)}
  .log{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--muted)}
  .log li{padding:3px 0}
  svg{display:block;width:100%;height:44px}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">TeachLoop · prod 生命体征</h1>
  <span id="overall" class="pill idle" data-i18n="connecting">连接中</span>
  <span class="spacer"></span>
  <span class="meta" id="meta">—</span>
  <span class="seg" role="group" aria-label="language">
    <button type="button" id="lang-zh" aria-pressed="true">中文</button>
    <button type="button" id="lang-en" aria-pressed="false">EN</button>
  </span>
  <span class="seg" role="group" aria-label="theme">
    <button type="button" id="theme-light" aria-pressed="true" data-i18n="themeLight">☀ 亮色</button>
    <button type="button" id="theme-dark" aria-pressed="false" data-i18n="themeDark">☾ 暗色</button>
  </span>
</header>
<main>
  <div id="banner"></div>
  <div class="grid">
    <section class="card">
      <h2 data-i18n="cardPublic">公网入口（Tunnel → nginx → app → DB）</h2>
      <div class="big"><span id="pub-ms">—</span><small id="pub-ms-unit"></small></div>
      <div class="row"><span class="k">HTTP</span><span class="v" id="pub-code">—</span></div>
      <div class="row"><span class="k" data-i18n="db">数据库</span><span class="v" id="pub-db">—</span></div>
      <div class="row"><span class="k" data-i18n="font">PDF 中文字体</span><span class="v" id="pub-font">—</span></div>
    </section>

    <section class="card">
      <h2 data-i18n="cardContainers">容器（docker compose prod）</h2>
      <div class="containers" id="containers"></div>
    </section>

    <section class="card">
      <h2 data-i18n="cardDisk">磁盘</h2>
      <div class="big" id="disk-pct">—</div>
      <div class="bar" id="disk-bar"><i style="width:0"></i></div>
      <div class="row"><span class="k" data-i18n="freeTotal">可用 / 总量</span><span class="v" id="disk-size">—</span></div>
      <div class="row"><span class="k" data-i18n="hostUptime">prod 运行</span><span class="v" id="host-uptime">—</span></div>
    </section>

    <section class="card">
      <h2 data-i18n="cardMem">内存</h2>
      <div class="big" id="mem-pct">—</div>
      <div class="bar" id="mem-bar"><i style="width:0"></i></div>
      <div class="row"><span class="k" data-i18n="usedTotal">已用 / 总量</span><span class="v" id="mem-size">—</span></div>
      <div class="row"><span class="k" data-i18n="available">可用</span><span class="v" id="mem-avail">—</span></div>
    </section>

    <section class="card">
      <h2 data-i18n="cardCpu">CPU（最近 5 分钟）</h2>
      <div class="big" id="cpu-pct">—</div>
      <svg id="cpu-spark" viewBox="0 0 300 44" preserveAspectRatio="none"></svg>
      <div class="row"><span class="k" data-i18n="load">load 1 / 5 / 15</span><span class="v" id="load">—</span></div>
    </section>

    <section class="card">
      <h2 id="reqs-title" data-i18n="cardReqs">今日请求</h2>
      <div class="big" id="reqs">—</div>
      <div class="row"><span class="k">5xx</span><span class="v" id="s5xx">—</span></div>
      <div class="row"><span class="k" data-i18n="probeCost">采集耗时</span><span class="v" id="probe-ms">—</span></div>
    </section>
  </div>

  <footer id="alerts"></footer>
</main>

<script>
(function () {
  'use strict';

  var I18N = {
    zh: {
      title: 'TeachLoop · prod 生命体征',
      connecting: '连接中',
      themeLight: '☀ 亮色', themeDark: '☾ 暗色',
      cardPublic: '公网入口（Tunnel → nginx → app → DB）',
      cardContainers: '容器（docker compose prod）',
      cardDisk: '磁盘', cardMem: '内存', cardCpu: 'CPU（最近 5 分钟）', cardReqs: '今日请求',
      db: '数据库', font: 'PDF 中文字体',
      freeTotal: '可用 / 总量', usedTotal: '已用 / 总量', available: '可用',
      hostUptime: 'prod 运行', load: 'load 1 / 5 / 15', probeCost: '采集耗时',
      ok: '全绿', warn: '需要看一眼', down: '异常', unknown: '未知',
      updated: '最后更新', collected: '采集', never: '从未成功', secondsAgo: ' 秒前', minutesAgo: ' 分钟前',
      boardDown: '看板未连接', banner: '拿不到数据：{msg}（看板服务本身可能挂了）',
      noContainers: '采集不到容器（SSH 探针未成功）',
      days: ' 天 ', hours: ' 小时 ', minutes: ' 分',
      boardUptime: '看板已运行 {v}', prodHost: 'prod 主机 {v}',
      probeOk: '采集正常', probeStale: '采集失联', mailErr: '邮件通道：{v}',
      restart: '重启 {n}', day: '（{d}）',
      aPublic: '公网入口不通', aPublicDetail: 'HTTP {http}，db={db} pdfFont={font}',
      aProbe: '采集失联（SSH 探针）', aProbeDetail: '{err}',
      aContainer: '容器 {svc} 不在运行', aUnhealthy: '容器 {svc} unhealthy',
      aDisk: '磁盘快满了', aDiskDetail: '已用 {pct}（{used}/{total}，剩 {avail}）',
      aMem: '内存快满了', aMemDetail: '已用 {pct}%（{used}/{total} MB）',
      kindDown: '异常', kindRepeat: '仍然异常', kindUp: '恢复'
    },
    en: {
      title: 'TeachLoop · prod vitals',
      connecting: 'Connecting',
      themeLight: '☀ Light', themeDark: '☾ Dark',
      cardPublic: 'Public entry (Tunnel → nginx → app → DB)',
      cardContainers: 'Containers (docker compose prod)',
      cardDisk: 'Disk', cardMem: 'Memory', cardCpu: 'CPU (last 5 min)', cardReqs: 'Requests today',
      db: 'Database', font: 'PDF CJK font',
      freeTotal: 'Free / total', usedTotal: 'Used / total', available: 'Available',
      hostUptime: 'prod uptime', load: 'load 1 / 5 / 15', probeCost: 'Probe time',
      ok: 'All green', warn: 'Needs a look', down: 'Down', unknown: 'Unknown',
      updated: 'Updated', collected: 'collected', never: 'never succeeded', secondsAgo: 's ago', minutesAgo: ' min ago',
      boardDown: 'Dashboard unreachable', banner: 'No data: {msg} (the vitals service itself may be down)',
      noContainers: 'No containers (SSH probe has not succeeded)',
      days: 'd ', hours: 'h ', minutes: 'm',
      boardUptime: 'Dashboard up {v}', prodHost: 'prod host {v}',
      probeOk: 'collecting', probeStale: 'collector blind', mailErr: 'Mail: {v}',
      restart: 'restarts {n}', day: ' ({d})',
      aPublic: 'Public entry down', aPublicDetail: 'HTTP {http}, db={db} pdfFont={font}',
      aProbe: 'Collector blind (SSH probe)', aProbeDetail: '{err}',
      aContainer: 'Container {svc} is not running', aUnhealthy: 'Container {svc} unhealthy',
      aDisk: 'Disk almost full', aDiskDetail: 'Used {pct} ({used}/{total}, {avail} free)',
      aMem: 'Memory almost full', aMemDetail: 'Used {pct}% ({used}/{total} MB)',
      kindDown: 'down', kindRepeat: 'still down', kindUp: 'recovered'
    }
  };

  var LANG = localStorage.getItem('vitals.lang') === 'en' ? 'en' : 'zh';
  var THEME = localStorage.getItem('vitals.theme') === 'dark' ? 'dark' : 'light';
  var SNAP = null;
  var timer = null;

  function t(key, args) {
    var s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
    if (args) {
      s = s.replace(/\{(\w+)\}/g, function (_, k) {
        return (args[k] === undefined || args[k] === null) ? '—' : args[k];
      });
    }
    return s;
  }
  function $(id) { return document.getElementById(id); }
  function set(id, text) { var el = $(id); if (el) el.textContent = text; }
  function cls(el, base, state) { if (el) el.className = base + ' ' + state; }

  function applyStatic() {
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    document.documentElement.setAttribute('data-theme', THEME);
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    $('lang-zh').setAttribute('aria-pressed', LANG === 'zh');
    $('lang-en').setAttribute('aria-pressed', LANG === 'en');
    $('theme-light').setAttribute('aria-pressed', THEME === 'light');
    $('theme-dark').setAttribute('aria-pressed', THEME === 'dark');
  }

  function humanUptime(s) {
    if (s === null || s === undefined) return '—';
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d > 0) return d + t('days') + h + t('hours');
    if (h > 0) return h + t('hours') + m + t('minutes');
    return m + t('minutes');
  }
  function ago(sec) {
    if (sec === null || sec === undefined) return t('never');
    if (sec < 2) return LANG === 'en' ? 'just now' : '刚刚';
    if (sec < 60) return sec + t('secondsAgo');
    return Math.floor(sec / 60) + t('minutesAgo');
  }
  function dockerStatus(status) {
    if (LANG === 'en') return status;
    var s = status.replace(/^Up /, '运行 ');
    s = s.replace(/\(healthy\)/g, '（健康）').replace(/\(unhealthy\)/g, '（不健康）');
    s = s.replace(/(\d+)\s+seconds?/, '$1 秒').replace(/(\d+)\s+minutes?/, '$1 分钟')
         .replace(/(\d+)\s+hours?/, '$1 小时').replace(/(\d+)\s+days?/, '$1 天');
    return s;
  }

  function alertTitle(a) {
    var args = a.args || {};
    switch (a.code) {
      case 'public_down': return t('aPublic');
      case 'probe_down': return t('aProbe');
      case 'container_down': return t('aContainer', args);
      case 'container_unhealthy': return t('aUnhealthy', args);
      case 'disk_high': return t('aDisk');
      case 'mem_high': return t('aMem');
      default: return a.title || '';
    }
  }
  function alertDetail(a) {
    var args = a.args || {};
    switch (a.code) {
      case 'public_down': return t('aPublicDetail', { http: args.http, db: args.db, font: args.font });
      case 'probe_down': return t('aProbeDetail', { err: args.err || '—' });
      case 'container_down': case 'container_unhealthy': return args.status || '';
      case 'disk_high': return t('aDiskDetail', args);
      case 'mem_high': return t('aMemDetail', args);
      default: return a.detail || '';
    }
  }

  function paintBar(id, pct) {
    var bar = $(id); if (!bar) return;
    bar.className = 'bar' + (pct >= 90 ? ' down' : pct >= 80 ? ' warn' : '');
    bar.firstElementChild.style.width = Math.max(0, Math.min(100, pct || 0)) + '%';
  }
  function spark(svgId, values) {
    var svg = $(svgId); if (!svg) return;
    var w = 300, h = 44, n = values.length, d = '';
    if (n > 1) {
      d = values.map(function (v, i) {
        var x = (i / (n - 1)) * w;
        var y = h - (Math.max(0, Math.min(100, v)) / 100) * h;
        return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }).join(' ');
    }
    var stroke = THEME === 'dark' ? '#2A6FD6' : '#1A63E0';
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="1.5" />';
  }

  function render(d) {
    SNAP = d;
    var overall = $('overall');
    cls(overall, 'pill', d.overall);
    overall.textContent = t(d.overall) || t('unknown');

    var banner = $('banner');
    banner.innerHTML = '';
    if (d.alerts.active && d.alerts.active.length) {
      var b = document.createElement('div');
      b.className = 'banner ' + (d.overall === 'down' ? 'down' : 'warn');
      b.textContent = d.alerts.active.map(function (a) {
        return alertTitle(a) + '：' + alertDetail(a);
      }).join(' ｜ ');
      banner.appendChild(b);
    }

    set('meta', t('updated') + ' ' + new Date(d.ts * 1000).toLocaleTimeString() +
      ' · ' + t('collected') + ' ' + ago(d.probe.age_s));

    set('pub-ms', d.public.ms === null ? '—' : d.public.ms);
    set('pub-ms-unit', d.public.ms === null ? '' : ' ms');
    set('pub-code', d.public.code || '—');
    set('pub-db', (d.public.deep && d.public.deep.db) || '—');
    set('pub-font', (d.public.deep && d.public.deep.pdfFont) || '—');

    var box = $('containers');
    box.innerHTML = '';
    (d.containers || []).forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'container';
      var left = document.createElement('span');
      var dot = document.createElement('i');
      dot.className = 'dot ' + (c.up ? (c.health ? 'down' : 'ok') : 'down');
      left.appendChild(dot);
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = c.svc;
      left.appendChild(name);
      var right = document.createElement('span');
      right.className = 'st';
      right.textContent = dockerStatus(c.status) + (c.restarts !== '0' ? ' · ' + t('restart', { n: c.restarts }) : '');
      row.appendChild(left); row.appendChild(right);
      box.appendChild(row);
    });
    if (!d.containers || !d.containers.length) box.textContent = t('noContainers');

    set('disk-pct', d.host.disk.pct + '%');
    paintBar('disk-bar', d.host.disk.pct);
    set('disk-size', (d.host.disk.avail || '—') + ' / ' + (d.host.disk.total || '—'));
    set('host-uptime', humanUptime(d.host.uptime_s));

    set('mem-pct', d.host.mem.pct + '%');
    paintBar('mem-bar', d.host.mem.pct);
    set('mem-size', (d.host.mem.used || '—') + ' / ' + (d.host.mem.total || '—') + ' MB');
    set('mem-avail', (d.host.mem.avail || '—') + ' MB');

    set('cpu-pct', (d.host.cpu === null || d.host.cpu === undefined) ? '—' : d.host.cpu + '%');
    set('load', d.host.load || '—');
    spark('cpu-spark', (d.history || []).map(function (p) { return p.cpu; }));

    set('reqs-title', t('cardReqs') + (d.http.day ? t('day', { d: d.http.day }) : ''));
    set('reqs', (d.http.requests_today === undefined || d.http.requests_today === null || d.http.requests_today === '')
      ? '—' : d.http.requests_today);
    set('s5xx', (d.http.s5xx === undefined || d.http.s5xx === null || d.http.s5xx === '') ? '—' : d.http.s5xx);
    set('probe-ms', d.probe.ms ? d.probe.ms + ' ms' : '—');

    var parts = [];
    parts.push(t('boardUptime', { v: humanUptime(d.uptime_s) }));
    parts.push(t('prodHost', { v: d.host.hostname || '—' }));
    parts.push((d.probe.fresh ? t('probeOk') : t('probeStale')) + (d.probe.err ? '（' + d.probe.err + '）' : ''));
    if (d.alerts.mail_ok === false && d.alerts.mail_err) parts.push(t('mailErr', { v: d.alerts.mail_err }));
    var foot = $('alerts');
    foot.innerHTML = '';
    var p = document.createElement('div');
    p.textContent = parts.join(' · ');
    foot.appendChild(p);
    if (d.alerts.log && d.alerts.log.length) {
      var ul = document.createElement('ul');
      ul.className = 'log';
      d.alerts.log.slice().reverse().forEach(function (a) {
        var li = document.createElement('li');
        var kind = { down: t('kindDown'), repeat: t('kindRepeat'), up: t('kindUp') }[a.kind] || a.kind;
        li.textContent = new Date(a.at * 1000).toLocaleTimeString() + ' · ' + kind + ' · ' + alertTitle(a);
        ul.appendChild(li);
      });
      foot.appendChild(ul);
    }
  }

  function fail(msg) {
    var overall = $('overall');
    cls(overall, 'pill', 'idle');
    overall.textContent = t('boardDown');
    var banner = $('banner');
    banner.innerHTML = '';
    var b = document.createElement('div');
    b.className = 'banner warn';
    b.textContent = t('banner', { msg: msg });
    banner.appendChild(b);
  }

  function tick() {
    fetch('/vitals/api', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { render(d); })
      .catch(function (e) { fail(e.message); })
      .finally(function () { clearTimeout(timer); timer = setTimeout(tick, 2000); });
  }

  function chooseLang(lang) {
    LANG = lang;
    localStorage.setItem('vitals.lang', lang);
    applyStatic();
    if (SNAP) render(SNAP);
  }
  function chooseTheme(theme) {
    THEME = theme;
    localStorage.setItem('vitals.theme', theme);
    applyStatic();
    if (SNAP) render(SNAP);
  }

  $('lang-zh').addEventListener('click', function () { chooseLang('zh'); });
  $('lang-en').addEventListener('click', function () { chooseLang('en'); });
  $('theme-light').addEventListener('click', function () { chooseTheme('light'); });
  $('theme-dark').addEventListener('click', function () { chooseTheme('dark'); });

  applyStatic();
  tick();
})();
