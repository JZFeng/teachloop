# dev：本机开发（scripts/dev.sh）。只写与 base 的差异，不复制 application.yml。
#
# 2026-10-28 约定：环境差异只放 overlay，业务开关一律走属性名（代码只认属性，不认 profile）。
teachloop:
  security:
    # 本机每个 POST 都先取 CSRF token 只会拖慢调试；生产/qa 打开。
    csrf: false
    require-profile-completion: false
  seed:
    # 显式写出来：DevDataSeeder 的 matchIfMissing=true 虽然也是开，但「默认开」是不可见的行为。
    enabled: true
  vocab:
    quiz:
      # US-87：小测默认关（base=false），dev 打开便于验收；关闭时端点 404、入口不渲染。
      enabled: true
    content:
      # 2026-10-31：V3 卡片数据（6 块，morphology/etymology 独立）；113 词新包。
      pack-dir: ${VOCAB_CONTENT_PACK_DIR:./fixtures-local/vocab-content-v3}
      prompt-version: ${VOCAB_CONTENT_PROMPT_VERSION:vocab-content-v3.0}
