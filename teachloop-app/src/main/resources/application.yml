server:
  port: ${PORT:8010}
  forward-headers-strategy: framework

spring:
  application:
    name: teachloop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teachloop}
    username: ${DB_USER:teachloop}
    password: ${DB_PASSWORD:teachloop}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # T060/T061：单文件 100 MB 上限（AC-6.5）
      max-file-size: 100MB
      max-request-size: 100MB

teachloop:
  storage:
    # T067：附件存储抽象；开发用 local，生产切 oss（未配置 bucket 时启动即报错）
    backend: ${STORAGE_BACKEND:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    oss:
      bucket: ${STORAGE_OSS_BUCKET:}
  grading:
    engine: stub
    poll-ms: 2000
    batch-size: 5
    # 到期派发的扫描周期（T092）；互斥在 SQL 条件更新，不靠这里
    dispatch-ms: 60000
    # 峰谷调度（T093）：北京时间工作日 9-12 / 14-18 为高峰，自动派发推迟到空闲起点；手动派发不受限
    peak-aware: true
    # 僵尸清扫（T091）：启动时 + 每 sweep-ms 把超过 stale-minutes 的 RUNNING 退回 PENDING
    sweep-ms: 120000
    stale-minutes: 5
  exam:
    # 到点自动交卷的扫描周期：归零后最迟这么久定稿（T199 验收要求 60 秒内）
    scan-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.teachloop: info
