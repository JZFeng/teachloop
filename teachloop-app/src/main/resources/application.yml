server:
  port: ${PORT:8010}
  forward-headers-strategy: framework

spring:
  application:
    name: teachloop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teachloop}
    username: ${DB_USER:teachloop}
    password: ${DB_PASSWORD:teachloop}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # T060/T061：单文件 100 MB 上限（AC-6.5）
      max-file-size: 100MB
      max-request-size: 100MB

teachloop:
  storage:
    # T067：附件存储抽象；开发用 local，生产切 oss（未配置 bucket 时启动即报错）
    backend: ${STORAGE_BACKEND:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    oss:
      bucket: ${STORAGE_OSS_BUCKET:}
  grading:
    engine: ${TEACHLOOP_GRADING_ENGINE:ai}
    poll-ms: 2000
    batch-size: 5
    # 到期派发的扫描周期（T092）；互斥在 SQL 条件更新，不靠这里
    dispatch-ms: 60000
    # 峰谷调度（T093）：北京时间工作日 9-12 / 14-18 为高峰，自动派发推迟到空闲起点；手动派发不受限
    # 只影响考试：作业改走下面的夜间批量（决策 003）
    peak-aware: true
    # 作业夜间批量（决策 003）：每晚 02:30（Asia/Shanghai）把所有排队中的作业提交推给 AI，
    # 不看截止时间；启动时补跑一次，避免恰好重启导致当晚空跑。
    assignment-cron: "0 30 2 * * *"
    assignment-zone: Asia/Shanghai
    assignment-catch-up: true
    # 僵尸清扫（T091）：启动时 + 每 sweep-ms 把超过 stale-minutes 的 RUNNING 退回 PENDING
    sweep-ms: 120000
    stale-minutes: 5
  exam:
    # 到点自动交卷的扫描周期：归零后最迟这么久定稿（T199 验收要求 60 秒内）
    scan-ms: 30000
  observability:
    # T140–T144：请求日志与前端事件写 JSONL 文件（不入业务库），按天滚动
    log-dir: ${OBSERVABILITY_LOG_DIR:./logs}
    # 日志保留天数；到期只删文件，审计永久保留（AC-16.5）
    retention-days: 90
    # 超过该耗时的请求计入 slow_requests
    slow-request-ms: 1000
    # 日志清理扫描周期（毫秒）
    cleanup-ms: 3600000
    # 每日汇总（UTC 00:10）聚合前一天文件；可用 cron 覆盖
    daily-stats-cron: "0 10 0 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.teachloop: info
