server:
  port: ${PORT:8010}
  forward-headers-strategy: framework

spring:
  application:
    name: teachloop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teachloop}
    username: ${DB_USER:teachloop}
    password: ${DB_PASSWORD:teachloop}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # T060/T061：单文件 100 MB 上限（AC-6.5）
      max-file-size: 100MB
      max-request-size: 100MB

teachloop:
  notification:
    # 通知正文里的截止时间按这个时区渲染（A1：正文由服务端拼，页面上的时间仍跟浏览器本地时区）。
    # 学生反馈样例「请在 10/28 15:00 之前预习」；换部署地区时改这里，不要依赖 JVM 默认时区。
    due-zone: ${TEACHLOOP_NOTIFICATION_DUE_ZONE:Asia/Shanghai}
  storage:
    # T067/T386：附件存储端口；开发用 local，生产切 s3（S3 兼容协议：阿里云 OSS / MinIO / R2）
    backend: ${STORAGE_BACKEND:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    # T386：backend=s3 时 endpoint/bucket/access-key-* 必填，缺任一项启动即失败（报错只列缺失项，不含密钥值）
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      region: ${STORAGE_S3_REGION:cn-hangzhou}
      bucket: ${STORAGE_S3_BUCKET:}
      access-key-id: ${STORAGE_S3_ACCESS_KEY_ID:}
      access-key-secret: ${STORAGE_S3_ACCESS_KEY_SECRET:}
      # 阿里云 OSS 只支持 virtual-hosted（保持 false）；本地 MinIO 测试设 true
      path-style: ${STORAGE_S3_PATH_STYLE:false}
      path-prefix: ${STORAGE_S3_PATH_PREFIX:teachloop/}
  vocab:
    # T389 功能开关（plan §11）：false 时不注册 vocab 路由、导航不出现（宪法第十五条）。
    # T413：页面（词库/复习/详情/加词/词集/编辑/发词/预习）已齐，默认打开；仍可用 VOCAB_ENABLED=false 关掉。
    enabled: ${VOCAB_ENABLED:true}
    lexicon:
      # T388：本地词族索引（28,276 族 / 80,579 形）。产物不进 git，先 `make vocab-lexicon`；
      # 目录不存在时词族区块降级隐藏（spec §8），不影响应用启动。
      enabled: ${VOCAB_LEXICON_ENABLED:true}
      dir: ${WORDLIST_INDEX_DIR:./fixtures-local/vocab-lexicon}
      # 启动装载期间到达的查询最多等这么久，之后按不可用处理
      load-timeout-ms: 5000
    review:
      # T402：每日新卡上限（超出次日再进队列）与单次最多加载张数
      daily-new-cards: ${VOCAB_REVIEW_DAILY_NEW_CARDS:20}
      queue-page-size: ${VOCAB_REVIEW_QUEUE_PAGE_SIZE:100}
      # T426：进入复习时先准备前 N 个词；之后按窗口懒加载（前端 cadence 20/100/200/400/…）
      prepare-first: ${VOCAB_REVIEW_PREPARE_FIRST:20}
      prepare-window-max: ${VOCAB_REVIEW_PREPARE_WINDOW_MAX:1000}
    word-family:
      # spec §14.4：详情页最多显示 N 个同族词（默认 8）
      max-members: ${VOCAB_WORD_FAMILY_MAX_MEMBERS:8}
    sets:
      # T406：单条词集词数上限（可配）
      max-words: ${VOCAB_SETS_MAX_WORDS:2000}
    generation:
      # T394：新词内容异步生成（释义/例句/构词/词族/音标）。engine=ai 默认，stub 仅测试/演示。
      enabled: ${VOCAB_GENERATION_ENABLED:true}
      engine: ${VOCAB_GENERATION_ENGINE:ai}
      poll-ms: ${VOCAB_GENERATION_POLL_MS:2000}
      batch-size: 5
      # 失败 3 次后标 FAILED；24 小时仍未完成标「内容缺失」并移出队列
      max-attempts: 3
      # 日预算（按 Asia/Shanghai 的今天计算已建 job 数）；打满时暂停入队
      daily-budget: ${VOCAB_GENERATION_DAILY_BUDGET:2000}
      timeout-ms: ${VOCAB_GENERATION_TIMEOUT_MS:60000}
      # T426：导入/发词只入库，默认不再批量生成；学生复习或看详情时按窗口准备。
      # 想恢复旧的「导入即全量生成」设为 true。
      on-import: ${VOCAB_GENERATION_ON_IMPORT:false}
    tts:
      # T410/T411：缓存 → 本地 Piper → 浏览器；只读单词本身
      provider: ${VOCAB_TTS_PROVIDER:local}
      engine: ${VOCAB_TTS_ENGINE:piper}
      engine-url: ${VOCAB_TTS_ENGINE_URL:http://127.0.0.1:5002}
      voice: ${VOCAB_TTS_VOICE:en_US-amy-medium}
      # T427：复习卡英/美两个喇叭各用各的音色；本地 Piper 按 voice 找模型文件
      voices:
        uk: ${VOCAB_TTS_VOICE_UK:en_GB-alan-medium}
        us: ${VOCAB_TTS_VOICE_US:en_US-amy-medium}
      # T438：默认略微放慢（1.0 偏快）；rate 会进缓存键，改值会重新合成
      rate: ${VOCAB_TTS_RATE:0.9}
      timeout-ms: ${VOCAB_TTS_TIMEOUT_MS:2000}
    srs:
      # T401：调度参数（spec §5）；改这里重启生效，不写死在代码里（FR-106）
      graduation:
        successes: ${VOCAB_SRS_GRADUATION_SUCCESSES:4}
        min-interval-days: ${VOCAB_SRS_GRADUATION_MIN_INTERVAL_DAYS:45}
        review-interval-days: ${VOCAB_SRS_GRADUATION_REVIEW_INTERVAL_DAYS:180}
      ease:
        min: ${VOCAB_SRS_EASE_MIN:1.30}
        max: ${VOCAB_SRS_EASE_MAX:3.00}
      forget-minutes: ${VOCAB_SRS_FORGET_MINUTES:5}
      hard-multiplier: ${VOCAB_SRS_HARD_MULTIPLIER:1.2}
      easy-multiplier: ${VOCAB_SRS_EASY_MULTIPLIER:1.3}
  grading:
    engine: ${TEACHLOOP_GRADING_ENGINE:ai}
    poll-ms: 2000
    batch-size: 5
    # 到期派发的扫描周期（T092）；互斥在 SQL 条件更新，不靠这里
    dispatch-ms: 60000
    # 教师级作业批改时机（决策 010）：每分钟扫描一次教师偏好。
    # 固定时间默认 02:30 Asia/Shanghai，教师可在 /profile 改时刻、时区与是否补跑。
    preference-scan-ms: 60000
    assignment-default-time: "02:30"
    assignment-default-zone: Asia/Shanghai
    assignment-default-catch-up: true
    # 僵尸清扫（T091）：启动时 + 每 sweep-ms 把超过 stale-minutes 的 RUNNING 退回 PENDING
    sweep-ms: 120000
    stale-minutes: 5
    # D-28：没有 rubric 的作文（题项级、试卷级都没有）按「内容 X% + 语法与拼写 (100-X)%」判分。
    # 这里只写内容百分比，语法与拼写自动取其余部分；默认 80/20。改完重启生效。
    # 题项级 rubric 或试卷级 rubric 存在时，永远以老师写的为准。
    essay-default-rubric:
      content-percent: ${TEACHLOOP_ESSAY_CONTENT_PERCENT:80}
  exam:
    # 到点自动交卷的扫描周期：归零后最迟这么久定稿（T199 验收要求 60 秒内）
    scan-ms: 30000
  observability:
    # T140–T144：请求日志与前端事件写 JSONL 文件（不入业务库），按天滚动
    log-dir: ${OBSERVABILITY_LOG_DIR:./logs}
    # 日志保留天数；到期只删文件，审计永久保留（AC-16.5）
    retention-days: 90
    # 超过该耗时的请求计入 slow_requests
    slow-request-ms: 1000
    # 日志清理扫描周期（毫秒）
    cleanup-ms: 3600000
    # 每日汇总（UTC 00:10）聚合前一天文件；可用 cron 覆盖
    daily-stats-cron: "0 10 0 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.teachloop: info
