notification.ai_circuit_open.title=AI grading paused (circuit open)
notification.ai_circuit_open.body=The model {8} failed {9} submissions in a row (last error kind {12}), so new grading is paused. One submission is retried automatically around {11}; a success resumes grading. Check the API key or switch the model in AI settings.
notification.ai_circuit_close.title=AI grading resumed
notification.ai_circuit_close.body=The model {8} recovered; {10} failed submission(s) were requeued automatically.
notification.ai_provider_failover.title=AI model switched automatically
notification.ai_provider_failover.body=Model {8} failed {9} submissions in a row and was cut off. Grading continues on {14}; it switches back after {15} consecutive successes and a 10-minute cooldown.
notification.ai_provider_failback.title=AI model switched back
notification.ai_provider_failback.body=Model {8} has recovered; switched back from {14} after {15} consecutive successes.
notification.ai_not_ready.title=AI is not configured, so automatic grading did not start
notification.ai_not_ready.body=Submissions for {3} assignment(s) or exam(s), starting with {0}, are still waiting: no AI model is configured. An administrator needs to set up AI in AI settings; the next scan continues automatically once it is ready, so no manual retry is needed.
notification.ai_not_ready.due.title=AI is not configured, so automatic grading did not start
notification.ai_not_ready.due.body=Submissions for {3} assignment(s) or exam(s), starting with {0}, are still waiting: {13} submission(s) in total, the earliest due {7}. No AI model is configured. An administrator needs to set up AI in AI settings; the next scan continues automatically once it is ready, so no manual retry is needed.

# A1: in-app notifications are rendered on read. Args: {0}=title, {1}=score, {2}=total,
# {3}=count, {4}=teacher, {5}=class, {6}=word set, {7}=due time (rendered in the deploy time zone),
# {8}=provider, {9}=consecutive failures, {10}=requeued, {11}=next probe time,
# {12}=last error kind, {13}=waiting submissions. Append new args; never renumber.
